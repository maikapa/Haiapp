          z2.x += (hx2 / hd2) * 70;
          z2.y += (hy2 / hd2) * 70;
          burst(z2.x, z2.y, '#FFFFFF', 10);
        }
      }
      shake = 4;
    }
    sfxShield();
  }

  function finishDive() {
    S.freed = S.stage % FRIENDS.length;
    S.friendN[S.freed] = (S.friendN[S.freed] || 0) + 1;
    S.sharkStage[S.sharkIdx] = myStage() + 1;   // nur der benutzte Hai waechst
    S.stage++;
    S.dive = null;
    S.newShark = -1;
    if (S.stage < SHARKS.length && S.unlocked.indexOf(S.stage) < 0) {
      S.unlocked.push(S.stage);
      S.newShark = S.stage;
    }
    saveProfile();
    boss = null;
    S.screen = 'reward';
  }

  // ---------------------------------------------------------------- Zeichnen: Szene

  function drawSea(area) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, area.top);
    g.addColorStop(1, area.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#FFFFFF';
    for (var i = 0; i < 4; i++) {
      var x = (W / 4) * i + 40 + Math.sin(S.t * 0.3 + i) * 18;
      ctx.beginPath();
      ctx.moveTo(x, -20); ctx.lineTo(x + 46, -20);
      ctx.lineTo(x + 130, H * 0.75); ctx.lineTo(x + 20, H * 0.75);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = area.sand;
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(0, H - 46);
    for (var x2 = 0; x2 <= W; x2 += 40) ctx.quadraticCurveTo(x2 + 20, H - 62, x2 + 40, H - 46);
    ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
  }

  function drawBubbles() {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 1.5;
    for (var i = 0; i < bubbles.length; i++) {
      circle(bubbles[i].x, bubbles[i].y, bubbles[i].r); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.col;
      circle(p.x, p.y, p.r); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHazard(z) {
    ctx.save();
    if (z.off > 0) ctx.globalAlpha = 0.45;
    if (z.kind === 'jelly') {
      ctx.translate(z.x, z.y);
      ctx.fillStyle = '#F4A9E8';
      ctx.beginPath();
      ctx.arc(0, 0, z.r, Math.PI, 0);
      ctx.quadraticCurveTo(z.r * 0.5, z.r * 0.35, 0, z.r * 0.2);
      ctx.quadraticCurveTo(-z.r * 0.5, z.r * 0.35, -z.r, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(244,169,232,0.85)';
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (var i = 0; i < 5; i++) {
        var tx = -z.r * 0.6 + i * (z.r * 0.3);
        ctx.beginPath();
        ctx.moveTo(tx, z.r * 0.2);
        ctx.quadraticCurveTo(tx + Math.sin(S.t * 3 + i) * 10, z.r * 0.9, tx + Math.sin(S.t * 3 + i) * 6, z.r * 1.5);
        ctx.stroke();
      }
      ctx.fillStyle = '#FFFFFF';
      circle(-6, -8, 3.5); ctx.fill();
      circle(7, -8, 3.5); ctx.fill();
    } else if (z.kind === 'net') {
      ctx.translate(z.x - z.w / 2, z.y - z.h / 2);
      ctx.strokeStyle = 'rgba(240,240,225,0.85)';
      ctx.lineWidth = 2.5;
      for (var gx = 0; gx <= z.w; gx += 16) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, z.h); ctx.stroke(); }
      for (var gy = 0; gy <= z.h; gy += 16) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(z.w, gy); ctx.stroke(); }
    } else if (z.kind === 'hook') {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(z.x, 0); ctx.lineTo(z.x, z.y); ctx.stroke();
      ctx.strokeStyle = '#D9DEE4';
      ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(z.x, z.y - 6);
      ctx.quadraticCurveTo(z.x, z.y + 16, z.x - 12, z.y + 10);
      ctx.quadraticCurveTo(z.x - 18, z.y + 4, z.x - 12, z.y - 2);
      ctx.stroke();
    } else if (z.kind === 'strudel') {
      ctx.translate(z.x, z.y);
      ctx.rotate(z.rot);
      ctx.strokeStyle = 'rgba(200,235,255,0.75)';
      ctx.lineCap = 'round';
      for (var w2 = 0; w2 < 3; w2++) {
        ctx.lineWidth = 6 - w2;
        ctx.beginPath();
        for (var sgm = 0; sgm <= 14; sgm++) {
          var ta = (sgm / 14) * 4.6 + w2 * 2.09;
          var tr = z.r * (0.18 + 0.8 * (sgm / 14));
          var qx = Math.cos(ta) * tr, qy = Math.sin(ta) * tr;
          if (sgm === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
        }
        ctx.stroke();
      }
    } else if (z.kind === 'bigshark') {
      drawShark(z.x, z.y, 190, z.dir > 0 ? 0 : Math.PI,
                { body: '#5C6B7A', belly: '#E5E9ED', shape: 'normal', pattern: 'none' },
                { tail: Math.sin(S.t * 4) });
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- UI

  var hit = [];
  function pushHit(x, y, w, h, fn) { hit.push({ x: x, y: y, w: w, h: h, fn: fn }); }

  function circleBtn(x, y, r, fill) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    circle(x, y + 3, r); ctx.fill();
    ctx.fillStyle = fill || 'rgba(255,255,255,0.92)';
    circle(x, y, r); ctx.fill();
  }

  function drawHomeIcon(x, y, r) {
    circleBtn(x, y, r);
    ctx.fillStyle = '#1B6E92';
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.5);
    ctx.lineTo(x + r * 0.55, y);
    ctx.lineTo(x + r * 0.35, y);
    ctx.lineTo(x + r * 0.35, y + r * 0.45);
    ctx.lineTo(x - r * 0.35, y + r * 0.45);
    ctx.lineTo(x - r * 0.35, y);
    ctx.lineTo(x - r * 0.55, y);
    ctx.closePath(); ctx.fill();
  }

  function drawFinIcon(x, y, r, col) {
    circleBtn(x, y, r);
    ctx.fillStyle = col || '#1B6E92';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.5, y + r * 0.45);
    ctx.quadraticCurveTo(x + r * 0.1, y + r * 0.3, x + r * 0.45, y - r * 0.55);
    ctx.quadraticCurveTo(x + r * 0.1, y + r * 0.05, x - r * 0.5, y + r * 0.45);
    ctx.closePath(); ctx.fill();
  }

  // Kopfzeile im Spiel: Fortschritt bis zum Boss + aktive Faehigkeiten
  function drawHud() {
    var w = Math.min(W * 0.5, 210), h = 16;
    var x = (W - w) / 2, y = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(x, y, w, h, h / 2); ctx.fill();
    var frac = Math.min(1, S.diveFish / FISH_FOR_BOSS);
    ctx.fillStyle = boss ? '#FF8A6B' : '#FFD24A';
    roundRect(x, y, Math.max(h, w * frac), h, h / 2); ctx.fill();

    if (boss) {
      // Panzerplatten als Anzeige
      var left = platesLeft();
      var total = boss.plates.length;
      for (var i = 0; i < total; i++) {
        var bx = x + w / 2 - (total - 1) * 9 / 2 + i * 9;
        ctx.fillStyle = i < left ? '#E8E0C8' : 'rgba(255,255,255,0.25)';
        roundRect(bx - 3.5, y + h + 6, 7, 10, 2); ctx.fill();
      }
    }

    // Faehigkeitsleiste unten
    var keys = [];
    for (var a = 0; a < ABILS.length; a++) if (lvl(ABILS[a].key) > 0) keys.push(ABILS[a].key);
    if (keys.length) {
      var iw = Math.min(40, (W - 24) / keys.length);
      var startX = W / 2 - (keys.length - 1) * iw / 2;
      var iy = H - 30;
      for (var b2 = 0; b2 < keys.length; b2++) {
        var ix = startX + b2 * iw;
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        circle(ix, iy, 17); ctx.fill();
        ctx.globalAlpha = 1;
        drawAbilIcon(keys[b2], ix, iy, 11, abilCol(keys[b2]));
        drawPearls(ix, iy + 22, lvl(keys[b2]), MAX_LEVEL, 2.2, abilCol(keys[b2]));
      }
    }

    // Schutzblase am Hai
    if (shark.shield > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(S.t * 3) * 0.08;
      ctx.strokeStyle = '#8ECBFF';
      ctx.lineWidth = 4;
      circle(shark.x, shark.y, 82 * sharkScale() * 0.62); ctx.stroke();
      ctx.restore();
    }
  }

  // Der eine Knopf: immer unten rechts, Wirkung haengt vom Hai ab
  function drawActionButton() {
    var ab2 = myAbil();
    var r = 34, x = W - 54, y = H - 76;
    var ready = S.actT <= 0;
    var col = abilCol(ab2.icon);

    if (ready) {
      ctx.save();
      ctx.globalAlpha = 0.25 + Math.sin(S.t * 4) * 0.12;
      ctx.fillStyle = col;
      circle(x, y, r + 8 + Math.sin(S.t * 4) * 3); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    circle(x, y + 3, r); ctx.fill();
    ctx.fillStyle = ready ? 'rgba(255,255,255,0.94)' : 'rgba(255,255,255,0.45)';
    circle(x, y, r); ctx.fill();

    if (!ready) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(x, y, r - 3, -1.5708, -1.5708 + 6.2832 * (1 - S.actT / ACT_COOLDOWN));
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = col;
      ctx.lineWidth = 4;
      circle(x, y, r - 2); ctx.stroke();
    }

    ctx.save();
    if (!ready) ctx.globalAlpha = 0.5;
    drawAbilIcon(ab2.icon, x, y, 17, col);
    ctx.restore();

    pushHit(x - r - 8, y - r - 8, (r + 8) * 2, (r + 8) * 2, function () {
      if (S.actT <= 0) useActive();
    });
  }

  // ---------------------------------------------------------------- Bildschirme

  function screenProfile() {
    drawSea(levelDef(0));
    drawBubbles();
    var n = PROFILES.length;
    var r = Math.min(W / (n + 1.4), H * 0.30) * 0.5;
    var gap = (W - n * r * 2) / (n + 1);
    for (var i = 0; i < n; i++) {
      var cx = gap + r + i * (r * 2 + gap);
      var cy = H * 0.5 + Math.sin(S.t * 1.6 + i) * 8;
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      circle(cx, cy, r); ctx.fill();
      drawShark(cx + r * 0.12, cy, r * 1.7, 0,
                { body: PROFILES[i].body, belly: PROFILES[i].belly, shape: 'normal', pattern: 'none' },
                { tail: Math.sin(S.t * 4 + i) });
      (function (idx, bx, by, br) {
        pushHit(bx - br, by - br, br * 2, br * 2, function () {
          S.pi = idx;
          var d = loadProfile(idx);
          S.stage = d.stage; S.sharkIdx = d.sharkIdx; S.unlocked = d.unlocked; S.boni = d.boni;
          S.friends = d.friends; S.friendN = d.friendN;
          S.sharkStage = d.sharkStage; S.dive = d.dive; S.catch = d.catch;
          if (S.unlocked.indexOf(S.sharkIdx) < 0) S.sharkIdx = 0;
          S.screen = 'home';
          sfxTap();
        });
      })(i, cx, cy, r);
    }
  }

  function totalFriends() {
    var n = 0;
    for (var i = 0; i < FRIENDS.length; i++) n += (S.friendN[i] || 0);
    return n;
  }
  // Welches Tier steht an Stelle i der Sammlung?
  function friendAt(i) {
    var acc = 0;
    for (var k = 0; k < FRIENDS.length; k++) {
      acc += (S.friendN[k] || 0);
      if (i < acc) return k;
    }
    return 0;
  }

  // Korallen: je mehr befreite Tiere, desto voller das Riff
  function drawReefCorals() {
    var n = Math.min(12, totalFriends());
    var cols = ['#F58B9C', '#F2B33D', '#7BC47F', '#B98FD0', '#5FC7C0', '#E8654C'];
    for (var i = 0; i < n; i++) {
      var seed = (i * 137) % 100;
      var x = 18 + (seed / 100) * (W - 36);
      var base = H - 34 - (i % 3) * 5;
      var hgt = 26 + (seed % 5) * 9;
      var col = cols[i % cols.length];
      ctx.strokeStyle = col;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.quadraticCurveTo(x + Math.sin(S.t * 0.8 + i) * 5, base - hgt * 0.6, x + Math.sin(S.t + i) * 7, base - hgt);
      ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x, base - hgt * 0.45);
      ctx.quadraticCurveTo(x - 12, base - hgt * 0.7, x - 15, base - hgt * 0.95);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, base - hgt * 0.35);
      ctx.quadraticCurveTo(x + 12, base - hgt * 0.6, x + 16, base - hgt * 0.85);
      ctx.stroke();
    }
  }

  // Freunde schwimmen im Riff. Je voller es wird, desto mehr Ebenen:
  // vorne gross und klar, dahinter kleiner und blasser, ganz hinten winzig.
  function drawReefFriends() {
    var total = totalFriends();
    var vorne = Math.min(total, 14);
    var mitte = Math.min(Math.max(0, total - 14), 26);
    var hinten = Math.min(Math.max(0, total - 40), 80);
    var boden = Math.max(0, total - 120);

    // hinterste Ebene zuerst
    var i, k, ph, fx, fy;
    ctx.save();
    ctx.globalAlpha = 0.32;
    for (i = 0; i < hinten; i++) {
      k = friendAt(40 + i);
      ph = i * 0.91;
      fx = W * 0.5 + Math.sin(S.t * 0.16 + ph) * (W * 0.46);
      fy = H * 0.30 + Math.sin(S.t * 0.24 + ph * 1.7) * (H * 0.16) + (i % 5) * 7;
      drawFriend(k, fx, fy, 7, Math.cos(S.t * 0.16 + ph) > 0 ? 1 : -1);
    }
    ctx.globalAlpha = 0.62;
    for (i = 0; i < mitte; i++) {
      k = friendAt(14 + i);
      ph = i * 1.31;
      fx = W * 0.5 + Math.sin(S.t * 0.24 + ph) * (W * 0.44);
      fy = H * 0.38 + Math.sin(S.t * 0.36 + ph * 1.4) * (H * 0.13) + (i % 4) * 9;
      drawFriend(k, fx, fy, 11, Math.cos(S.t * 0.24 + ph) > 0 ? 1 : -1);
    }
    ctx.restore();

    for (i = 0; i < vorne; i++) {
      k = friendAt(i);
      ph = i * 1.73;
      fx = W * 0.5 + Math.sin(S.t * 0.32 + ph) * (W * 0.40);
      fy = H * 0.44 + Math.sin(S.t * 0.47 + ph * 1.3) * (H * 0.09) + (i % 3) * 12;
      drawFriend(k, fx, fy, 17, Math.cos(S.t * 0.32 + ph) > 0 ? 1 : -1);
    }

    // ab 120 sitzen weitere Tiere als Deko am Boden
    var bn = Math.min(boden, 30);
    for (i = 0; i < bn; i++) {
      k = friendAt(120 + i);
      var bx2 = 16 + ((i * 53) % 100) / 100 * (W - 32);
      var by2 = H - 22 - (i % 3) * 9;
      ctx.save();
      ctx.globalAlpha = 0.85;
      drawFriend(k, bx2, by2, 10, (i % 2) ? 1 : -1);
      ctx.restore();
    }
  }

  function screenHome() {
    drawSea(levelDef(0));
    drawBubbles();
    drawReefCorals();
    drawReefFriends();

    var hx = W * 0.5 + Math.sin(S.t * 0.5) * (W * 0.22);
    var hy = H * 0.26 + Math.sin(S.t * 0.9) * 14;
    drawShark(hx, hy, Math.min(92 * stageScale(), W * 0.78), Math.cos(S.t * 0.5) > 0 ? 0 : Math.PI,
              SHARKS[S.sharkIdx], { tail: Math.sin(S.t * 5), mods: sharkMods(boniLvl) });

    // dauerhafte Startboni
    var bk = [];
    for (var k in S.boni) if (S.boni.hasOwnProperty(k) && S.boni[k] > 0) bk.push(k);
    if (bk.length) {
      var bw = Math.min(46, (W - 40) / bk.length);
      var sx = W / 2 - (bk.length - 1) * bw / 2;
      for (var i3 = 0; i3 < bk.length; i3++) {
        var ix = sx + i3 * bw, iy = H * 0.62;
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        circle(ix, iy, 19); ctx.fill();
        drawAbilIcon(bk[i3], ix, iy, 12, abilCol(bk[i3]));
        drawPearls(ix, iy + 24, S.boni[bk[i3]], MAX_BONUS, 2.6, abilCol(bk[i3]));
      }
    }

    // Grosser Tauchknopf: der Hai zeigt nach unten, Pfeile darunter
    var by = H * 0.82, br = Math.min(64, W * 0.19);
    var lv = levelDef(S.stage);
    ctx.save();
    circle(W / 2, by, br + 10);
    ctx.clip();
    var gd = ctx.createLinearGradient(0, by - br, 0, by + br);
    gd.addColorStop(0, lv.top);
    gd.addColorStop(1, lv.bot);
    ctx.fillStyle = gd;
    ctx.fillRect(W / 2 - br - 10, by - br - 10, (br + 10) * 2, (br + 10) * 2);
    ctx.restore();
    ctx.strokeStyle = '#FFD24A';
    ctx.lineWidth = 5;
    circle(W / 2, by, br + 8); ctx.stroke();

    drawShark(W / 2, by - br * 0.42, br * 1.15, 1.5708 + Math.sin(S.t * 2) * 0.12,
              SHARKS[S.sharkIdx], { tail: Math.sin(S.t * 6), mods: sharkMods(boniLvl) });

    // das gefangene Tier der naechsten Tiefe, klein im Netz
    var capt = S.stage % FRIENDS.length;
    var cyy = by + br * 0.34;
    drawFriend(capt, W / 2, cyy, br * 0.30, 1);
    ctx.strokeStyle = 'rgba(245,245,230,0.9)';
    ctx.lineWidth = 1.6;
    for (var nx = -1; nx <= 1; nx++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + nx * 12, cyy - br * 0.32);
      ctx.lineTo(W / 2 + nx * 12, cyy + br * 0.32);
      ctx.stroke();
    }
    for (var ny = -1; ny <= 1; ny++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 - br * 0.42, cyy + ny * 12);
      ctx.lineTo(W / 2 + br * 0.42, cyy + ny * 12);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (var ar = 0; ar < 2; ar++) {
      var ay = by + br * 0.52 + ar * 11 + Math.sin(S.t * 3 + ar) * 2;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 13, ay); ctx.lineTo(W / 2, ay + 9); ctx.lineTo(W / 2 + 13, ay);
      ctx.stroke();
    }
    pushHit(W / 2 - br - 10, by - br - 10, (br + 10) * 2, (br + 10) * 2, function () {
      sfxTap(); startDive();
    });

    drawHomeIcon(32, 34, 22);
    pushHit(10, 12, 44, 44, function () { S.screen = 'profile'; saveProfile(); sfxTap(); });
    drawFinIcon(W - 32, 34, 22, SHARKS[S.sharkIdx].body);
    pushHit(W - 54, 12, 44, 44, function () { S.screen = 'sharks'; sfxTap(); });
    drawBookIcon(W - 96, 34, 22);
    pushHit(W - 118, 12, 44, 44, function () { S.screen = 'book'; sfxTap(); });
  }

  function screenGame() {
    drawSea(levelDef(S.stage));
    drawBubbles();
    for (var i = 0; i < hazards.length; i++) drawHazard(hazards[i]);
    if (boss) drawBoss(boss);
    for (var j = 0; j < fishes.length; j++) drawFish(fishes[j]);
    for (var q = 0; q < buddies.length; q++) {
      drawFish({ x: buddies[q].x, y: buddies[q].y, r: 9, dir: Math.cos(S.t * 1.6 + buddies[q].ph) > 0 ? 1 : -1, col: buddies[q].col });
    }

    if (target && shark.stun <= 0) {
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      var bk3 = shark.ang + Math.PI;
      for (var ln = 0; ln < 3; ln++) {
        var off = (ln - 1) * 12;
        var sxl = shark.x + Math.cos(bk3) * 34 - Math.sin(bk3) * off;
        var syl = shark.y + Math.sin(bk3) * 34 + Math.cos(bk3) * off;
        ctx.beginPath();
        ctx.moveTo(sxl, syl);
        ctx.lineTo(sxl + Math.cos(bk3) * (16 + ln * 6), syl + Math.sin(bk3) * (16 + ln * 6));
        ctx.stroke();
      }
      ctx.restore();
    }

    if (helper) drawFriend(helper.idx, helper.x, helper.y, 15, Math.cos(S.t * 0.35 + helper.ph) > 0 ? 1 : -1);

    // Spur beim Rasen
    if (trail.length) {
      ctx.save();
      for (var tq = 0; tq < trail.length; tq++) {
        var tp = trail[tq];
        ctx.globalAlpha = 0.30 * (1 - tp.t / 0.5) * (tq / trail.length);
        ctx.fillStyle = '#FFD24A';
        circle(tp.x, tp.y, 16 + tq); ctx.fill();
      }
      ctx.restore();
    }

    // Ausbreitender Ring beim Ausloesen
    if (ring) {
      ctx.save();
      var rf = ring.t / 0.75;
      ctx.globalAlpha = 0.7 * (1 - rf);
      ctx.strokeStyle = ring.col;
      ctx.lineWidth = 12 * (1 - rf) + 3;
      circle(ring.x, ring.y, ring.max * rf); ctx.stroke();
      ctx.restore();
    }

    // Sogstoss: Wirbel um den Hai
    if (S.fx.sogstoss > 0) {
      ctx.save();
      ctx.strokeStyle = '#7CE0C0';
      ctx.lineWidth = 4;
      for (var sw = 0; sw < 3; sw++) {
        ctx.globalAlpha = 0.5;
        var rr3 = 40 + sw * 60 - (S.t * 220 % 60);
        if (rr3 > 10) { circle(shark.x, shark.y, rr3); ctx.stroke(); }
      }
      ctx.restore();
    }

    // Riesenbiss: der vergroesserte Beisskreis wird sichtbar
    if (S.fx.riesenbiss > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(S.t * 8) * 0.12;
      ctx.strokeStyle = '#FF6F91';
      ctx.lineWidth = 5;
      circle(shark.x, shark.y, 82 * sharkScale() * 0.34 * 2 * (1 + 0.18 * lvl('maul'))); ctx.stroke();
      ctx.restore();
    }

    // Tarnen: der Hai wird durchsichtig
    if (S.fx.tarnen > 0) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#FFFFFF';
      circle(shark.x, shark.y, 120); ctx.fill();
      ctx.restore();
    }

    // Allgemeine Aura, damit man immer sieht: gerade wirkt etwas
    if (S.fx.aura > 0) {
      ctx.save();
      ctx.globalAlpha = 0.30 * Math.min(1, S.fx.aura);
      ctx.strokeStyle = abilCol(myAbil().icon);
      ctx.lineWidth = 6;
      circle(shark.x, shark.y, 82 * sharkScale() * 0.62 + 8 + Math.sin(S.t * 6) * 4); ctx.stroke();
      ctx.restore();
    }

    drawShark(shark.x, shark.y, 82 * sharkScale(), shark.ang, SHARKS[S.sharkIdx],
              { mouth: shark.mouth, dizzy: shark.stun > 0 ? 1 : 0, tail: shark.tail,
                mods: sharkMods(lvl) });

    // Biss-Rueckmeldung: Aufleuchten und ein Ring am Maul, nie ueber die Groesse
    if (shark.pop > 0) {
      var pl3 = Math.min(1, shark.pop);
      var mlen = 82 * sharkScale();
      var mx3 = shark.x + Math.cos(shark.ang) * mlen * 0.42;
      var my3 = shark.y + Math.sin(shark.ang) * mlen * 0.42;
      ctx.save();
      ctx.globalAlpha = 0.55 * pl3;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3 + 5 * pl3;
      circle(mx3, my3, mlen * 0.18 + (1 - pl3) * mlen * 0.30); ctx.stroke();
      ctx.globalAlpha = 0.30 * pl3;
      ctx.fillStyle = '#FFFFFF';
      circle(shark.x, shark.y, mlen * 0.34); ctx.fill();
      ctx.restore();
    }

    if (shark.stun > 0) {
      ctx.save();
      ctx.fillStyle = '#FFF3B0';
      for (var s = 0; s < 3; s++) {
        var a = S.t * 6 + s * 2.1;
        circle(shark.x + Math.cos(a) * 30, shark.y - 46 + Math.sin(a) * 10, 5); ctx.fill();
      }
      ctx.restore();
    }

    drawParts();

    // Einmal pro Tauchgang zeigen, was der Knopf dieses Hais macht
    if (S.fx.intro > 0) {
      var iv = Math.min(1, S.fx.intro / 0.6);
      var abx = W - 54, aby = H - 76;
      var gz = Math.min(1, (3.2 - S.fx.intro) / 0.5);
      var px2 = W / 2 + (abx - W / 2) * gz * 0.55;
      var py2 = H * 0.42 + (aby - H * 0.42) * gz * 0.55;
      ctx.save();
      ctx.globalAlpha = 0.9 * iv;
      ctx.fillStyle = 'rgba(3,26,40,0.72)';
      circle(px2, py2, 78 - gz * 24); ctx.fill();
      ctx.strokeStyle = abilCol(myAbil().icon);
      ctx.lineWidth = 4;
      circle(px2, py2, 78 - gz * 24); ctx.stroke();
      if (gz < 0.6) {
        drawAbilDemo(myAbil().demo, px2, py2, (78 - gz * 24) * 0.62, abilCol(myAbil().icon));
      } else {
        drawAbilIcon(myAbil().icon, px2, py2, (78 - gz * 24) * 0.5, abilCol(myAbil().icon));
      }
      ctx.strokeStyle = abilCol(myAbil().icon);
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.6 * iv;
      circle(abx, aby, 44 + Math.sin(S.t * 6) * 4); ctx.stroke();
      ctx.restore();
    }

    drawHud();

    drawHomeIcon(32, 34, 22);
    pushHit(10, 12, 44, 44, function () { stashDive(); S.screen = 'home'; sfxTap(); });

    pushHit(0, 66, W, H - 66, function (px, py) {
      var best = null, bestD = 999999;
      for (var k = 0; k < fishes.length; k++) {
        var f = fishes[k];
        var dx = f.x - px, dy = f.y - py;
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = f; }
      }
      if (best && bestD < 90 * 90) target = { x: best.x, y: best.y, fish: best };
      else target = { x: px, y: py, fish: null };
      sfxTap();
    });

    drawActionButton();
  }

  // Zwei grosse Bildkarten
  function drawCardScreen(keys, levelOf, maxLev, onPick) {
    ctx.fillStyle = 'rgba(3,26,40,0.72)';
    ctx.fillRect(0, 0, W, H);

    var n = keys.length;
    var cw = Math.min((W - 60) / n, 200);
    var ch = Math.min(cw * 1.35, H * 0.52);
    var gap = (W - n * cw) / (n + 1);
    var cy = (H - ch) / 2;

    for (var i = 0; i < n; i++) {
      var cx = gap + i * (cw + gap);
      var key = keys[i];
      var col = abilCol(key);
      var bob = Math.sin(S.t * 2 + i) * 4;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      roundRect(cx + 4, cy + bob + 8, cw, ch, 22); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      roundRect(cx, cy + bob, cw, ch, 22); ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 6;
      roundRect(cx, cy + bob, cw, ch, 22); ctx.stroke();

      drawAbilDemo(key, cx + cw / 2, cy + bob + ch * 0.40, cw * 0.28, col);

      var cur = levelOf(key);
      drawPearls(cx + cw / 2, cy + bob + ch * 0.76, cur + 1, maxLev, cw * 0.045, col);

      (function (k, bx, by, bw2, bh2) {
        pushHit(bx, by, bw2, bh2, function () { onPick(k); });
      })(key, cx, cy + bob, cw, ch);
    }
  }

  function screenCards() {
    drawSea(levelDef(S.stage));
    for (var i = 0; i < fishes.length; i++) drawFish(fishes[i]);
    drawShark(shark.x, shark.y, 82 * sharkScale(), shark.ang, SHARKS[S.sharkIdx],
              { tail: 0, mods: sharkMods(lvl) });
    drawCardScreen(S.cards, lvl, MAX_LEVEL, applyCard);
  }

  function bonusOptions() {
    var pool = [];
    for (var i = 0; i < ABILS.length; i++) {
      var k = ABILS[i].key;
      var cur = S.boni[k] || 0;
      if (cur < MAX_BONUS) pool.push(k);
    }
    var out = [];
    for (var j = 0; j < 2 && pool.length; j++) {
      out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return out;
  }

  function screenBonus() {
    drawSea(levelDef(0));
    drawBubbles();
    drawParts();
    if (!S.cards.length) S.cards = bonusOptions();
    if (!S.cards.length) { S.screen = 'home'; return; }
    drawCardScreen(S.cards, function (k) { return S.boni[k] || 0; }, MAX_BONUS, function (k) {
      S.boni[k] = Math.min(MAX_BONUS, (S.boni[k] || 0) + 1);
      S.cards = [];
      saveProfile();
      sfxTap();
      S.screen = 'home';
    });
  }

  function screenReward() {
    drawSea(levelDef(0));
    drawBubbles();
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, H * 0.40);
    ctx.rotate(S.t * 0.4);
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#FFF3B0';
    for (var i = 0; i < 12; i++) {
      ctx.rotate(6.2832 / 12);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, -22); ctx.lineTo(150, 22);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.18 + Math.sin(S.t * 3) * 0.08;
    ctx.fillStyle = '#FFF3B0';
    circle(W / 2, H * 0.36, Math.min(W * 0.32, 140)); ctx.fill();
    ctx.restore();
    drawShark(W / 2, H * 0.36, Math.min(W * 0.55, 230), 0, SHARKS[S.sharkIdx],
              { tail: Math.sin(S.t * 5), mods: sharkMods(boniLvl) });

    // Befreites Tier, daneben die Perle
    if (S.freed >= 0) {
      var fy2 = H * 0.58 + Math.sin(S.t * 2) * 6;
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#FFF3B0';
      circle(W / 2 - 34, fy2, 52); ctx.fill();
      ctx.restore();
      drawFriend(S.freed, W / 2 - 34, fy2, 34, 1);
    }
    ctx.fillStyle = '#FFF3B0';
    circle(W / 2 + 62, H * 0.58, 20); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    circle(W / 2 + 56, H * 0.58 - 7, 6); ctx.fill();

    if (S.newShark >= 0) {
      drawShark(W / 2, H * 0.68, Math.min(W * 0.34, 140), 0, SHARKS[S.newShark], { tail: Math.sin(S.t * 5) });
      ctx.strokeStyle = '#FFD24A';
      ctx.lineWidth = 4;
      circle(W / 2, H * 0.68, Math.min(W * 0.2, 82)); ctx.stroke();
    }

    if (Math.random() < 0.25) burst(W / 2 + (Math.random() - 0.5) * 200, H * 0.40 + (Math.random() - 0.5) * 120, '#FFF3B0', 2);
    drawParts();

    var by = H * 0.86, br = 42;
    circleBtn(W / 2, by, br, '#FFD24A');
    drawFish({ x: W / 2 + 6, y: by, r: 14, dir: 1, col: '#FF6F91' });
    pushHit(W / 2 - br, by - br, br * 2, br * 2, function () {
      S.newShark = -1;
      S.freed = -1;
      S.cards = [];
      sfxTap();
      S.screen = 'bonus';
    });
  }

  function drawBookIcon(x, y, r) {
    circleBtn(x, y, r);
    ctx.fillStyle = '#1B6E92';
    roundRect(x - r * 0.55, y - r * 0.45, r * 1.10, r * 0.90, r * 0.12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = Math.max(1.5, r * 0.09);
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.45); ctx.lineTo(x, y + r * 0.45);
    ctx.stroke();
    drawFish({ x: x + r * 0.02, y: y, r: r * 0.22, dir: 1, col: '#FFD84A', kind: 'klein', ph: 0 });
  }

  function screenBook() {
    drawSea(levelDef(0));
    drawBubbles();
    ctx.fillStyle = 'rgba(3,26,40,0.55)';
    ctx.fillRect(0, 0, W, H);

    var cols = 2;
    var tw = (W - 40 - 14) / cols;
    var th = tw * 0.60;
    var top = 92;
    for (var i = 0; i < FISH_KINDS.length; i++) {
      var kd = FISH_KINDS[i];
      var cx = 20 + (i % cols) * (tw + 14);
      var cy = top + Math.floor(i / cols) * (th + 12);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(cx, cy, tw, th, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      roundRect(cx, cy, tw, th, 14); ctx.stroke();

      drawFish({ x: cx + tw * 0.30, y: cy + th * 0.50, r: Math.min(th * 0.24, 16) * kd.rr,
                 dir: 1, col: kd.col, kind: kd.id, ph: i });

      var n = S.catch[kd.id] || 0;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold ' + Math.round(th * 0.38) + 'px -apple-system, Helvetica, Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(n), cx + tw - 14, cy + th * 0.50);
      ctx.textAlign = 'left';

      // Wert als Perlenreihe, damit auch ohne Lesen klar ist: der ist mehr wert
      drawPearls(cx + tw * 0.30, cy + th * 0.86, Math.min(kd.val, 5), 5, 3, kd.col);
    }

    drawHomeIcon(32, 34, 22);
    pushHit(10, 12, 44, 44, function () { S.screen = 'home'; sfxTap(); });
  }

  function screenSharks() {
    drawSea(levelDef(0));
    drawBubbles();
    var cols = 2;
    var tw = (W - 40 - 14) / cols;
    var th = tw * 0.62;
    var top = 84;
    for (var i = 0; i < SHARKS.length; i++) {
      var cx = 20 + (i % cols) * (tw + 14);
      var cy = top + Math.floor(i / cols) * (th + 14);
      var open = S.unlocked.indexOf(i) >= 0;
      ctx.fillStyle = open ? 'rgba(255,255,255,0.20)' : 'rgba(0,0,0,0.18)';
      roundRect(cx, cy, tw, th, 16); ctx.fill();
      if (open) {
        // jeder Hai in seiner tatsaechlichen Groesse
        drawShark(cx + tw * 0.5, cy + th * 0.50, Math.min(tw * 0.33 * scaleOfShark(i), tw * 0.92), 0, SHARKS[i],
                  { tail: Math.sin(S.t * 4 + i), mods: sharkMods(boniLvl) });
        var ai = SHARK_ABIL[i] ? SHARK_ABIL[i].icon : 'turbo';
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        circle(cx + tw - 22, cy + 22, 15); ctx.fill();
        drawAbilIcon(ai, cx + tw - 22, cy + 22, 9, abilCol(ai));
        if (i === S.sharkIdx) {
          ctx.strokeStyle = '#FFD24A';
          ctx.lineWidth = 5;
          roundRect(cx, cy, tw, th, 16); ctx.stroke();
        }
        (function (idx) {
          pushHit(cx, cy, tw, th, function () { S.sharkIdx = idx; saveProfile(); sfxTap(); S.screen = 'home'; });
        })(i);
      } else {
        ctx.globalAlpha = 0.35;
        drawShark(cx + tw * 0.5, cy + th * 0.52, tw * 0.72, 0,
                  { body: '#26404E', belly: '#26404E', shape: SHARKS[i].shape, pattern: 'none' }, { tail: 0 });
        ctx.globalAlpha = 1;
      }
    }
    drawHomeIcon(32, 34, 22);
    pushHit(10, 12, 44, 44, function () { S.screen = 'home'; sfxTap(); });
  }

  // ---------------------------------------------------------------- Eingabe

  function pointFromEvent(e) {
    var r = cv.getBoundingClientRect();
    var t = (e.touches && e.touches.length) ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function handleTap(px, py) {
    audioInit();
    if (actx && actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    for (var i = hit.length - 1; i >= 0; i--) {
      var h = hit[i];
      if (px >= h.x && px <= h.x + h.w && py >= h.y && py <= h.y + h.h) { h.fn(px, py); return; }
    }
  }

  cv.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var p = pointFromEvent(e);
    handleTap(p.x, p.y);
  }, false);

  cv.addEventListener('mousedown', function (e) {
    var p = pointFromEvent(e);
    handleTap(p.x, p.y);
  }, false);

  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  // ---------------------------------------------------------------- Schleife

  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;

    update(dt);

    hit = [];
    ctx.clearRect(0, 0, W, H);
    var shook = shake > 0.2 && S.screen === 'game';
    if (shook) {
      ctx.save();
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    if (S.screen === 'profile') screenProfile();
    else if (S.screen === 'home') screenHome();
    else if (S.screen === 'game') screenGame();
    else if (S.screen === 'cards') screenCards();
    else if (S.screen === 'bonus') screenBonus();
    else if (S.screen === 'reward') screenReward();
    else if (S.screen === 'sharks') screenSharks();
    else if (S.screen === 'book') screenBook();
    if (shook) ctx.restore();

    window.requestAnimationFrame(frame);
  }

  resize();
  window.requestAnimationFrame(frame);
})();
</script>
<script>
// Service Worker anmelden. Bei neuer Version laedt die Seite einmal automatisch neu.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
    var neuGeladen = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (neuGeladen) return;
      neuGeladen = true;
      window.location.reload();
    });
  });
}
</script>
