<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="theme-color" content="#07293b">
<title>Hai</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #07293b; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize, false);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); }, false);

  // ---------------------------------------------------------------- Konstanten

  // Bei diesen Punktstaenden kommt eine Karte. Die Abstaende werden groesser,
  // im Bosskampf kommt also nur noch selten eine.
  var CARD_POINTS = [20, 50, 80, 130, 190, 260];
  var CARD_STEP = 90;               // danach alle 90 Punkte

  function cardThreshold(idx) {
    if (idx < CARD_POINTS.length) return CARD_POINTS[idx];
    return CARD_POINTS[CARD_POINTS.length - 1] + CARD_STEP * (idx - CARD_POINTS.length + 1);
  }
  var FISH_FOR_BOSS = 90;    // ab 90 Punkten taucht der Boss auf
  var MAX_LEVEL = 5;
  var MAX_BONUS = 2;         // hoechste dauerhafte Startstufe je Faehigkeit

  var PROFILES = [
    { body: '#FF8A3D', belly: '#FFE2C4' },
    { body: '#2FC2A8', belly: '#D6F6EE' },
    { body: '#A97BE8', belly: '#EDE0FB' }
  ];

  var SHARKS = [
    { body: '#3E7BC8', belly: '#E9F2FC', shape: 'normal',   pattern: 'none' },    // Blauhai
    { body: '#8B98A6', belly: '#F3F5F7', shape: 'normal',   pattern: 'none' },    // Weisser Hai
    { body: '#C9A23F', belly: '#F7EED4', shape: 'normal',   pattern: 'stripes' }, // Tigerhai
    { body: '#7C90AA', belly: '#EDF1F6', shape: 'hammer',   pattern: 'none' },    // Hammerhai
    { body: '#4A6FA5', belly: '#E4EDF8', shape: 'whale',    pattern: 'spots' },   // Walhai
    { body: '#9B7BC4', belly: '#EFE6FA', shape: 'saw',      pattern: 'none' },    // Saegehai
    { body: '#D8C24A', belly: '#FBF4D2', shape: 'normal',   pattern: 'none' },    // Zitronenhai
    { body: '#6E8AA8', belly: '#EEF3F8', shape: 'normal',   pattern: 'tips' },    // Schwarzspitzenhai
    { body: '#4F6A86', belly: '#E6EDF5', shape: 'thresher', pattern: 'none' },    // Fuchshai
    { body: '#A98A5A', belly: '#F0E4CE', shape: 'flat',     pattern: 'spots' },   // Teppichhai
    { body: '#6B6257', belly: '#E8E2D8', shape: 'normal',   pattern: 'none' },    // Groenlandhai
    { body: '#2F6FB5', belly: '#E3EEFA', shape: 'normal',   pattern: 'tips' }     // Makohai
  ];

  // Je Hai eine Passive und eine Knopf-Faehigkeit. Reihenfolge wie SHARKS.
  var SHARK_ABIL = [
    { pass: 'turbo',     lv: 1, act: 'schwarm',      icon: 'schwarm',    demo: 'ruf' },       // Blauhai
    { pass: 'maul',      lv: 1, act: 'riesenbiss',   icon: 'maul',       demo: 'maul' },      // Weisser Hai
    { pass: 'zaeh',      lv: 1, act: 'schuetteln',   icon: 'elektro',    demo: 'elektro' },   // Tigerhai
    { pass: 'sog',       lv: 1, act: 'sogstoss',     icon: 'sog',        demo: 'sog' },       // Hammerhai
    { pass: 'filter',    lv: 1, act: 'schluckwelle', icon: 'welle',      demo: 'maul' },      // Walhai
    { pass: 'panzer',    lv: 1, act: 'saege',        icon: 'panzer',     demo: 'panzer' },    // Saegehai
    { pass: 'begleiter', lv: 1, act: 'rufen',        icon: 'begleiter',  demo: 'begleiter' }, // Zitronenhai
    { pass: 'sprint',    lv: 1, act: 'doppelsprint', icon: 'turbo',      demo: 'turbo' },     // Schwarzspitzenhai
    { pass: 'peitsche',  lv: 1, act: 'peitsche',     icon: 'peitsche',   demo: 'elektro' },   // Fuchshai
    { pass: 'tarnung',   lv: 1, act: 'tarnen',       icon: 'tarnung',    demo: 'sog' },       // Teppichhai
    { pass: 'blase',     lv: 1, act: 'blaseauf',     icon: 'blase',      demo: 'blase' },     // Groenlandhai
    { pass: 'turbo',     lv: 2, act: 'rakete',       icon: 'turbo',      demo: 'turbo' }      // Makohai
  ];
  var ACT_COOLDOWN = 10;

  function myAbil() { return SHARK_ABIL[S.sharkIdx] || SHARK_ABIL[0]; }
  function hasPass(name) { return myAbil().pass === name; }

  // Bosse werden zusammengesetzt: Koerper x Panzeranordnung x Bewegung
  var BOSSES = ['muschel', 'krake', 'boot', 'orca', 'krabbe', 'angler', 'kalmar', 'uboot'];
  var BOSS_ARMOR = ['ring', 'reihen', 'schild', 'kreuz'];
  var BOSS_MOVE = ['treiben', 'kreisen', 'stuermen', 'aufab'];

  // gut durchmischt, aber fuer dieselbe Tiefe immer gleich
  function bossHash(d, salt) {
    var x = Math.sin(d * 12.9898 + salt * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function bossSetup(d) {
    var def = levelDef(d);
    return {
      body: def.boss,
      armor: BOSS_ARMOR[Math.floor(bossHash(d, 1) * BOSS_ARMOR.length) % BOSS_ARMOR.length],
      move: BOSS_MOVE[Math.floor(bossHash(d, 2) * BOSS_MOVE.length) % BOSS_MOVE.length]
    };
  }

  // Die ersten zwoelf Tiefen sind von Hand gesetzt, danach wird kombiniert.
  var LEVELS = [
    { haz: 'none',     boss: 'muschel', top: '#6FD8EE', bot: '#1E93C4', sand: '#F5DFAE' },
    { haz: 'jelly',    boss: 'krake',   top: '#4FC6D4', bot: '#177894', sand: '#EAD2A2' },
    { haz: 'net',      boss: 'krabbe',  top: '#3AACC2', bot: '#12607C', sand: '#DEC494' },
    { haz: 'none',     boss: 'boot',    top: '#57BFA8', bot: '#186A62', sand: '#E8D4A0' },
    { haz: 'hook',     boss: 'angler',  top: '#2F9DB8', bot: '#0E5570', sand: '#D6BC8A' },
    { haz: 'jelly',    boss: 'orca',    top: '#3E8FC0', bot: '#134C74', sand: '#CDB484' },
    { haz: 'bigshark', boss: 'kalmar',  top: '#2A7FA8', bot: '#0B3E5C', sand: '#C2A87C' },
    { haz: 'net',      boss: 'muschel', top: '#26709C', bot: '#093550', sand: '#B79E74' },
    { haz: 'strudel',  boss: 'uboot',   top: '#2C6A93', bot: '#082E46', sand: '#AC9469' },
    { haz: 'hook',     boss: 'krake',   top: '#1F5C86', bot: '#06263C', sand: '#9E875F' },
    { haz: 'bigshark', boss: 'krabbe',  top: '#1B4E76', bot: '#051E30', sand: '#8F7A56' },
    { haz: 'strudel',  boss: 'orca',    top: '#163F63', bot: '#041726', sand: '#826F4E' }
  ];

  // Bausteine fuer alles ab Tiefe zwoelf
  var HAZ_POOL = ['jelly', 'net', 'hook', 'bigshark', 'strudel', 'none'];
  var PALETTES = [
    { top: '#2E7FA8', bot: '#0A3550' }, { top: '#3E7A9E', bot: '#0C2F4A' },
    { top: '#2A8F92', bot: '#0A3E44' }, { top: '#4B6FA8', bot: '#12294A' },
    { top: '#3B6E8E', bot: '#0A2436' }, { top: '#54749E', bot: '#161F3A' }
  ];
  var SANDS = ['#9E875F', '#8F7A56', '#7E6C4C', '#A08A63', '#6F6045'];

  var ABILS = [
    { key: 'sog',        col: '#7CE0C0' },
    { key: 'turbo',      col: '#FFD24A' },
    { key: 'blase',      col: '#8ECBFF' },
    { key: 'begleiter',  col: '#FF9E3D' },
    { key: 'maul',       col: '#FF6F91' },
    { key: 'elektro',    col: '#C6A0FF' },
    { key: 'ruf',        col: '#FFC060' },
    { key: 'panzer',     col: '#E8E0C8' }
  ];

  var FRIENDS = ['schildkroete', 'seepferd', 'delfin', 'rochen', 'krebs', 'oktopus', 'seestern', 'wal'];

  // Fischarten: Groesse und Form zeigen den Wert, nicht die Farbe allein
  var FISH_KINDS = [
    { id: 'klein',    val: 1,  w: 42, rr: 1.00, sp: 1.00, col: '#FFB13D' },
    { id: 'streifen', val: 2,  w: 25, rr: 1.15, sp: 1.10, col: '#7CE0C0' },
    { id: 'dick',     val: 3,  w: 18, rr: 1.55, sp: 0.70, col: '#FF6F91' },
    { id: 'kugel',    val: 4,  w: 9,  rr: 1.70, sp: 0.55, col: '#C6A0FF' },
    { id: 'gold',     val: 5,  w: 5,  rr: 1.30, sp: 1.55, col: '#FFD84A' },
    { id: 'robbe',    val: 10, w: 1,  rr: 2.30, sp: 0.90, col: '#9AA7B4' }
  ];
  var FISH_W_SUM = 100;

  function pickFishKind() {
    var r = Math.random() * FISH_W_SUM, acc = 0;
    for (var i = 0; i < FISH_KINDS.length; i++) {
      acc += FISH_KINDS[i].w;
      if (r < acc) return FISH_KINDS[i];
    }
    return FISH_KINDS[0];
  }
  function kindById(id) {
    for (var i = 0; i < FISH_KINDS.length; i++) if (FISH_KINDS[i].id === id) return FISH_KINDS[i];
    return FISH_KINDS[0];
  }

  var FISH_COLORS = ['#FFB13D', '#FFD84A', '#FF6F91', '#7CE0C0', '#C6A0FF', '#FF8F5E'];

  // ---------------------------------------------------------------- Zustand

  var S = {
    screen: 'profile',
    pi: -1,
    stage: 0,
    sharkIdx: 0,
    unlocked: [0],
    boni: {},          // dauerhafte Startstufen: key -> 1..MAX_BONUS
    friends: [],
    friendN: {},        // Anzahl je befreiter Tierart
    freed: -1,
    catch: {},          // Fangbuch: wie viele je Fischart insgesamt
    sharkStage: {},     // Groesse je Hai, getrennt gezaehlt
    dive: null,         // angefangener Tauchgang, ueberlebt das Schliessen
    actT: 0,            // Abklingzeit der Knopf-Faehigkeit
    fx: {},             // laufende Effekte der Knopf-Faehigkeit
    ab: {},            // Faehigkeiten im laufenden Tauchgang
    diveFish: 0,
    cardIdx: 0,
    cards: [],
    newShark: -1,
    t: 0
  };

  function saveKey(i) { return 'haiapp.v2.p' + i; }

  function loadProfile(i) {
    var raw = null;
    try { raw = window.localStorage.getItem(saveKey(i)); } catch (e) { raw = null; }
    var d = { stage: 0, sharkIdx: 0, unlocked: [0], boni: {}, friends: [], friendN: {}, sharkStage: {}, dive: null, 'catch': {} };
    if (!raw) return d;
    try {
      var p = JSON.parse(raw);
      d.stage = p.stage || 0;
      d.sharkIdx = p.sharkIdx || 0;
      d.unlocked = (p.unlocked && p.unlocked.length) ? p.unlocked : [0];
      d.boni = p.boni || {};
      d.friends = p.friends || [];
      d.friendN = p.friendN || null;
      if (!d.friendN) {                  // alter Spielstand: Liste in Zaehler umrechnen
        d.friendN = {};
        for (var fi = 0; fi < d.friends.length; fi++) {
          d.friendN[d.friends[fi]] = (d.friendN[d.friends[fi]] || 0) + 1;
        }
      }
      d.sharkStage = p.sharkStage || {};
      d.catch = p['catch'] || {};
      d.dive = p.dive || null;
    } catch (e) { /* kaputter Stand: frisch anfangen */ }
    return d;
  }

  function saveProfile() {
    if (S.pi < 0) return;
    try {
      window.localStorage.setItem(saveKey(S.pi), JSON.stringify({
        stage: S.stage, sharkIdx: S.sharkIdx, unlocked: S.unlocked, boni: S.boni,
        friendN: S.friendN, sharkStage: S.sharkStage, dive: S.dive,
        'catch': S.catch
      }));
    } catch (e) { /* Speichern optional */ }
  }

  // Wie sieht es in dieser Tiefe aus? Bis zwoelf handgesetzt, danach kombiniert.
  function levelDef(d) {
    if (d < LEVELS.length) return LEVELS[d];
    var i = d - LEVELS.length;
    var pal = PALETTES[i % PALETTES.length];
    var deep = Math.min(0.55, i * 0.02);
    return {
      haz: HAZ_POOL[i % HAZ_POOL.length],
      boss: BOSSES[Math.floor(bossHash(i, 3) * BOSSES.length) % BOSSES.length],
      top: mixHex(pal.top, '#04121F', deep),
      bot: mixHex(pal.bot, '#02090F', deep),
      sand: SANDS[i % SANDS.length]
    };
  }

  function lvl(key) { return S.ab[key] || 0; }

  function totalLevels() {
    var n = 0;
    for (var i = 0; i < ABILS.length; i++) n += lvl(ABILS[i].key);
    return n;
  }

  // Jeder Hai hat seine eigene Groesse und wird einzeln hochgezogen.
  // Die Groesse haengt an einer durchgehenden Zahl: bestandene Tauchgaenge
  // plus Fortschritt im laufenden. Dadurch faengt ein Tauchgang immer genau
  // dort an, wo der letzte aufgehoert hat - der Hai wird nie wieder kleiner.
  var SIZE_SPAN = 3.05;    // Endgroesse rund 4,05 - die Haelfte mehr als vorher
  var SIZE_RATE = 0.0855;  // so gewaehlt, dass die ersten Tauchgaenge gleich stark wachsen
  var BITE_CAP = 2.7;      // fuer den Beisskreis zaehlt Groesse nur bis hierhin

  function sizeAt(x) { return 1 + SIZE_SPAN * (1 - Math.exp(-SIZE_RATE * x)); }

  function sharkStageOf(i) { return S.sharkStage[i] || 0; }
  function myStage() { return sharkStageOf(S.sharkIdx); }
  function stageScale() { return sizeAt(myStage()); }
  function scaleOfShark(i) { return sizeAt(sharkStageOf(i)); }

  // im Tauchgang faengt er klein an und wird deutlich groesser
  function sharkScale() {
    var frac = Math.min(1, S.diveFish / FISH_FOR_BOSS);
    return sizeAt(myStage() + frac);
  }

  function sharkMods(src) {
    return {
      maul: src('maul'), turbo: src('turbo'), panzer: src('panzer'),
      elektro: src('elektro'), sog: src('sog'),
      total: src('maul') + src('turbo') + src('panzer') + src('elektro') +
             src('sog') + src('blase') + src('begleiter') + src('ruf')
    };
  }
  function boniLvl(k) { return S.boni[k] || 0; }

  function mixHex(a, b, t) {
    var ar = parseInt(a.substr(1, 2), 16), ag = parseInt(a.substr(3, 2), 16), ab = parseInt(a.substr(5, 2), 16);
    var br = parseInt(b.substr(1, 2), 16), bg = parseInt(b.substr(3, 2), 16), bb2 = parseInt(b.substr(5, 2), 16);
    function h2(v) { var x = Math.round(v).toString(16); return x.length < 2 ? '0' + x : x; }
    return '#' + h2(ar + (br - ar) * t) + h2(ag + (bg - ag) * t) + h2(ab + (bb2 - ab) * t);
  }



  // ---------------------------------------------------------------- Ton

  var actx = null;
  function audioInit() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch (e) { actx = null; }
  }
  function beep(freq, dur, type, vol, delay) {
    if (!actx) return;
    try {
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* egal */ }
  }
  function sfxEat()   { beep(520 + Math.random() * 130, 0.11, 'sine', 0.15, 0); beep(900, 0.07, 'triangle', 0.07, 0.03); }
  function sfxTap()   { beep(300, 0.06, 'sine', 0.07, 0); }
  function sfxBump()  { beep(150, 0.22, 'sine', 0.15, 0); beep(108, 0.28, 'sine', 0.10, 0.04); }
  function sfxShield(){ beep(700, 0.10, 'triangle', 0.12, 0); beep(1100, 0.10, 'sine', 0.08, 0.06); }
  function sfxCrack() { beep(240, 0.10, 'square', 0.10, 0); beep(180, 0.14, 'square', 0.08, 0.05); }
  function sfxCard()  { beep(660, 0.12, 'triangle', 0.14, 0); beep(880, 0.16, 'triangle', 0.12, 0.10); }
  function sfxWin()   {
    beep(523, 0.14, 'triangle', 0.16, 0);
    beep(659, 0.14, 'triangle', 0.16, 0.11);
    beep(784, 0.14, 'triangle', 0.16, 0.22);
    beep(1046, 0.34, 'triangle', 0.16, 0.33);
  }

  // ---------------------------------------------------------------- Zeichenhilfen

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); }

  // ---------------------------------------------------------------- Hai

  function bodyPath() {
    ctx.beginPath();
    ctx.moveTo(1.00, 0.02);
    ctx.bezierCurveTo(0.60, -0.30, 0.10, -0.34, -0.45, -0.20);
    ctx.lineTo(-0.86, -0.10);
    ctx.lineTo(-0.86, 0.13);
    ctx.bezierCurveTo(-0.30, 0.30, 0.40, 0.28, 1.00, 0.02);
    ctx.closePath();
  }

  function drawShark(x, y, len, ang, def, o) {
    o = o || {};
    var mouth = o.mouth || 0;
    var dizzy = o.dizzy || 0;
    var tail = o.tail || 0;
    var s = len / 2;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    if (Math.cos(ang) < 0) ctx.scale(1, -1);
    var yStretch = 1;
    if (def.shape === 'whale') yStretch = 1.22;
    if (def.shape === 'flat') yStretch = 0.74;
    ctx.scale(s, s * yStretch);
    if (dizzy > 0) ctx.globalAlpha = 0.78;

    ctx.fillStyle = def.body;
    var TL = def.shape === 'thresher' ? 2.1 : 1;   // Fuchshai hat eine sehr lange Schwanzspitze
    ctx.beginPath();
    ctx.moveTo(-0.80, 0.02);
    ctx.lineTo(-0.80 - 0.50 * TL, (-0.46 + tail * 0.10) * TL);
    ctx.lineTo(-1.08, 0.02);
    ctx.lineTo(-1.26, 0.40 + tail * 0.10);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-0.08, -0.28); ctx.lineTo(0.04, -0.74); ctx.lineTo(0.30, -0.22);
    ctx.closePath(); ctx.fill();

    bodyPath(); ctx.fill();

    ctx.save();
    bodyPath(); ctx.clip();
    ctx.fillStyle = def.belly;
    ctx.beginPath();
    ctx.moveTo(1.00, 0.06);
    ctx.bezierCurveTo(0.40, 0.34, -0.30, 0.34, -0.90, 0.16);
    ctx.lineTo(-0.90, 0.40); ctx.lineTo(1.05, 0.40);
    ctx.closePath(); ctx.fill();

    if (def.pattern === 'stripes') {
      ctx.fillStyle = 'rgba(60,45,20,0.35)';
      for (var i = 0; i < 5; i++) {
        var sx = 0.42 - i * 0.26;
        ctx.beginPath();
        ctx.moveTo(sx, -0.36);
        ctx.quadraticCurveTo(sx - 0.06, 0, sx, 0.30);
        ctx.lineTo(sx - 0.08, 0.30);
        ctx.quadraticCurveTo(sx - 0.14, 0, sx - 0.08, -0.36);
        ctx.closePath(); ctx.fill();
      }
    }
    if (def.pattern === 'spots') {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      var sp = [[-0.62, -0.10], [-0.36, 0.06], [-0.30, -0.16], [-0.02, -0.06],
                [0.04, 0.12], [0.30, -0.12], [0.34, 0.08], [-0.58, 0.12], [0.56, -0.04]];
      for (var j = 0; j < sp.length; j++) { circle(sp[j][0], sp[j][1], 0.055); ctx.fill(); }
    }
    ctx.restore();

    ctx.fillStyle = def.body;
    ctx.beginPath();
    if (def.shape === 'flat') {
      ctx.moveTo(0.40, 0.10); ctx.lineTo(-0.10, 0.86); ctx.lineTo(0.56, 0.22);
    } else {
      ctx.moveTo(0.34, 0.12); ctx.lineTo(0.02, 0.60); ctx.lineTo(0.46, 0.20);
    }
    ctx.closePath(); ctx.fill();

    if (def.pattern === 'tips') {
      ctx.fillStyle = 'rgba(28,34,44,0.85)';
      ctx.beginPath();
      ctx.moveTo(-0.02, -0.58); ctx.lineTo(0.04, -0.74); ctx.lineTo(0.16, -0.52);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-1.30, -0.46); ctx.lineTo(-1.14, -0.31); ctx.lineTo(-1.20, -0.51);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0.02, 0.60); ctx.lineTo(0.16, 0.44); ctx.lineTo(0.20, 0.56);
      ctx.closePath(); ctx.fill();
    }

    if (def.shape === 'saw') {
      ctx.fillStyle = def.belly;
      roundRect(0.96, -0.05, 0.55, 0.10, 0.05); ctx.fill();
      ctx.fillStyle = def.body;
      for (var k = 0; k < 5; k++) {
        var tx = 1.04 + k * 0.10;
        ctx.beginPath(); ctx.moveTo(tx, -0.05); ctx.lineTo(tx + 0.04, -0.16); ctx.lineTo(tx + 0.07, -0.05);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(tx, 0.05); ctx.lineTo(tx + 0.04, 0.16); ctx.lineTo(tx + 0.07, 0.05);
        ctx.closePath(); ctx.fill();
      }
    }
    if (def.shape === 'hammer') {
      ctx.fillStyle = def.body;
      roundRect(0.78, -0.48, 0.22, 0.96, 0.10); ctx.fill();
    }

    // sichtbare Upgrades: je mehr Faehigkeiten, desto monstroeser
    var md = o.mods;
    if (md) {
      if (md.turbo > 0) {
        ctx.fillStyle = def.body;
        var tn = Math.min(3, md.turbo);
        for (var tf = 0; tf < tn; tf++) {
          var fx = -0.40 - tf * 0.16;
          ctx.beginPath();
          ctx.moveTo(fx, 0.16);
          ctx.lineTo(fx - 0.20, 0.52 + tf * 0.05);
          ctx.lineTo(fx + 0.08, 0.22);
          ctx.closePath(); ctx.fill();
        }
      }
      if (md.panzer > 0) {
        ctx.fillStyle = '#EFE7CE';
        ctx.strokeStyle = 'rgba(70,58,40,0.55)';
        ctx.lineWidth = 0.02;
        for (var sp2 = 0; sp2 < md.panzer; sp2++) {
          var bx2 = -0.50 + sp2 * 0.20;
          var by2 = -0.20 - Math.max(0, 0.10 - Math.abs(bx2) * 0.10);
          ctx.beginPath();
          ctx.moveTo(bx2 - 0.08, by2);
          ctx.lineTo(bx2, by2 - 0.22);
          ctx.lineTo(bx2 + 0.08, by2);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      }
      if (md.total >= 8) {
        ctx.fillStyle = def.body;
        ctx.beginPath();
        ctx.moveTo(-0.68, -0.14); ctx.lineTo(-0.60, -0.50); ctx.lineTo(-0.40, -0.20);
        ctx.closePath(); ctx.fill();
      }
      if (md.elektro > 0) {
        ctx.save();
        ctx.strokeStyle = '#C6A0FF';
        ctx.lineWidth = 0.03 + 0.012 * md.elektro;
        ctx.globalAlpha = 0.45 + 0.35 * Math.abs(Math.sin(S.t * 9));
        bodyPath(); ctx.stroke();
        ctx.restore();
      }
      if (md.sog > 0) {
        ctx.save();
        ctx.strokeStyle = '#7CE0C0';
        ctx.lineWidth = 0.035;
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.arc(0.95, 0.06, 0.16 + 0.05 * md.sog, S.t * 3, S.t * 3 + 4.2);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (mouth > 0.05) {
      ctx.fillStyle = '#7C2B3A';
      ctx.beginPath();
      ctx.moveTo(0.94, 0.06);
      ctx.quadraticCurveTo(0.74, 0.14 + 0.22 * mouth, 0.52, 0.16);
      ctx.quadraticCurveTo(0.72, 0.10, 0.94, 0.06);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(40,40,50,0.5)';
      ctx.lineWidth = 0.035; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0.94, 0.07);
      ctx.quadraticCurveTo(0.74, 0.17, 0.52, 0.15);
      ctx.stroke();
    }

    var ex = def.shape === 'hammer' ? 0.89 : 0.64;

    if (md && md.maul > 0) {
      ctx.fillStyle = '#FFFFFF';
      var tn2 = 2 + md.maul;
      for (var q2 = 0; q2 < tn2; q2++) {
        var tt = q2 / (tn2 - 1);
        var txp = 0.90 - tt * 0.36;
        var typ = 0.075 + tt * 0.070;
        ctx.beginPath();
        ctx.moveTo(txp - 0.032, typ);
        ctx.lineTo(txp, typ + 0.085 + 0.010 * md.maul);
        ctx.lineTo(txp + 0.032, typ);
        ctx.closePath(); ctx.fill();
      }
    }

    var ey = def.shape === 'hammer' ? -0.36 : -0.13;
    ctx.fillStyle = '#FFFFFF';
    circle(ex, ey, 0.105); ctx.fill();
    if (dizzy > 0.5) {
      ctx.strokeStyle = '#2B2B33'; ctx.lineWidth = 0.028;
      ctx.beginPath();
      ctx.moveTo(ex - 0.06, ey - 0.06); ctx.lineTo(ex + 0.06, ey + 0.06);
      ctx.moveTo(ex + 0.06, ey - 0.06); ctx.lineTo(ex - 0.06, ey + 0.06);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#20222A';
      circle(ex + 0.03, ey, 0.055); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      circle(ex + 0.05, ey - 0.025, 0.02); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawFish(f) {
    var kind = f.kind || 'klein';
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.dir < 0 ? Math.PI : 0);
    var r = f.r;

    if (kind === 'robbe') {
      ctx.fillStyle = '#8D9AA8';
      ctx.beginPath();
      ctx.moveTo(r * 1.25, -r * 0.15);
      ctx.bezierCurveTo(r * 0.6, -r * 0.75, -r * 0.5, -r * 0.7, -r * 1.05, -r * 0.15);
      ctx.bezierCurveTo(-r * 0.5, r * 0.65, r * 0.6, r * 0.6, r * 1.25, -r * 0.15);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.1); ctx.lineTo(-r * 1.5, -r * 0.5);
      ctx.lineTo(-r * 1.45, r * 0.25); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6F7C8A';
      ctx.beginPath();
      ctx.moveTo(r * 0.1, r * 0.35); ctx.lineTo(-r * 0.25, r * 0.85);
      ctx.lineTo(r * 0.45, r * 0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; circle(r * 0.72, -r * 0.35, r * 0.20); ctx.fill();
      ctx.fillStyle = '#20222A'; circle(r * 0.76, -r * 0.35, r * 0.11); ctx.fill();
      circle(r * 1.12, -r * 0.12, r * 0.10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = Math.max(1, r * 0.06);
      for (var wh = -1; wh <= 1; wh++) {
        ctx.beginPath();
        ctx.moveTo(r * 1.05, r * 0.02);
        ctx.lineTo(r * 1.55, r * 0.02 + wh * r * 0.24);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }

    if (kind === 'gold') {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(S.t * 7 + f.ph) * 0.2;
      ctx.fillStyle = '#FFF3B0';
      circle(0, 0, r * 1.9); ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = f.col;
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, 0); ctx.lineTo(-r * 1.6, -r * 0.6); ctx.lineTo(-r * 1.6, r * 0.6);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    if (kind === 'kugel') {
      ctx.arc(0, 0, r * 0.95, 0, 6.2832);
    } else if (ctx.ellipse) {
      ctx.ellipse(0, 0, r * 1.1, r * (kind === 'dick' ? 0.95 : 0.72), 0, 0, 6.2832);
    } else {
      ctx.arc(0, 0, r, 0, 6.2832);
    }
    ctx.fill();

    if (kind === 'streifen') {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      for (var st = -1; st <= 1; st++) {
        ctx.beginPath();
        if (ctx.ellipse) ctx.ellipse(st * r * 0.42, 0, r * 0.12, r * 0.62, 0, 0, 6.2832);
        else ctx.arc(st * r * 0.42, 0, r * 0.14, 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
    }
    if (kind === 'kugel') {
      ctx.strokeStyle = f.col;
      ctx.lineWidth = Math.max(1.5, r * 0.14);
      ctx.lineCap = 'round';
      for (var sk = 0; sk < 8; sk++) {
        var sa = (6.2832 / 8) * sk;
        ctx.beginPath();
        ctx.moveTo(Math.cos(sa) * r * 0.9, Math.sin(sa) * r * 0.9);
        ctx.lineTo(Math.cos(sa) * r * 1.3, Math.sin(sa) * r * 1.3);
        ctx.stroke();
      }
    }
    if (kind === 'gold') {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      circle(-r * 0.15, -r * 0.3, r * 0.16); ctx.fill();
    }

    ctx.fillStyle = '#FFFFFF'; circle(r * 0.5, -r * 0.15, r * 0.24); ctx.fill();
    ctx.fillStyle = '#20222A'; circle(r * 0.56, -r * 0.15, r * 0.12); ctx.fill();
    ctx.restore();
  }

  // Befreite Meerestiere
  function drawFriend(idx, x, y, r, dir) {
    var kind = FRIENDS[idx % FRIENDS.length];
    ctx.save();
    ctx.translate(x, y);
    if (dir < 0) ctx.scale(-1, 1);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (kind === 'schildkroete') {
      ctx.fillStyle = '#7BC47F';
      circle(r * 0.85, -r * 0.05, r * 0.30); ctx.fill();
      ctx.fillStyle = '#5E9E62';
      ctx.beginPath();
      ctx.moveTo(-r * 0.6, r * 0.3); ctx.lineTo(-r * 0.95, r * 0.65);
      ctx.lineTo(-r * 0.35, r * 0.45); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(r * 0.3, r * 0.35); ctx.lineTo(r * 0.15, r * 0.8);
      ctx.lineTo(r * 0.6, r * 0.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3F7A52';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 0, r * 0.9, r * 0.66, 0, 0, 6.2832);
      else ctx.arc(0, 0, r * 0.8, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = '#5E9E62';
      circle(-r * 0.3, -r * 0.1, r * 0.20); ctx.fill();
      circle(r * 0.25, r * 0.12, r * 0.18); ctx.fill();
      ctx.fillStyle = '#20222A';
      circle(r * 0.95, -r * 0.12, r * 0.08); ctx.fill();
    } else if (kind === 'seepferd') {
      ctx.strokeStyle = '#F2B33D';
      ctx.lineWidth = r * 0.42;
      ctx.beginPath();
      ctx.moveTo(r * 0.15, -r * 0.85);
      ctx.quadraticCurveTo(-r * 0.5, -r * 0.3, r * 0.0, r * 0.25);
      ctx.quadraticCurveTo(r * 0.45, r * 0.75, -r * 0.1, r * 0.85);
      ctx.stroke();
      ctx.fillStyle = '#F2B33D';
      ctx.beginPath();
      ctx.moveTo(r * 0.1, -r * 1.0); ctx.lineTo(r * 0.85, -r * 0.78);
      ctx.lineTo(r * 0.15, -r * 0.55); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#20222A';
      circle(r * 0.28, -r * 0.82, r * 0.09); ctx.fill();
    } else if (kind === 'delfin') {
      ctx.fillStyle = '#7FA8C8';
      ctx.beginPath();
      ctx.moveTo(r * 1.15, -r * 0.05);
      ctx.bezierCurveTo(r * 0.5, -r * 0.5, -r * 0.3, -r * 0.5, -r * 0.85, -r * 0.15);
      ctx.lineTo(-r * 0.85, r * 0.2);
      ctx.bezierCurveTo(-r * 0.2, r * 0.45, r * 0.6, r * 0.35, r * 1.15, -r * 0.05);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, 0); ctx.lineTo(-r * 1.3, -r * 0.45);
      ctx.lineTo(-r * 1.1, 0); ctx.lineTo(-r * 1.3, r * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.4); ctx.lineTo(r * 0.1, -r * 0.85); ctx.lineTo(r * 0.35, -r * 0.35);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#20222A';
      circle(r * 0.72, -r * 0.18, r * 0.09); ctx.fill();
    } else if (kind === 'rochen') {
      ctx.fillStyle = '#B98FD0';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.7);
      ctx.quadraticCurveTo(r * 1.2, -r * 0.1, 0, r * 0.7);
      ctx.quadraticCurveTo(-r * 1.2, -r * 0.1, 0, -r * 0.7);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#B98FD0';
      ctx.lineWidth = r * 0.14;
      ctx.beginPath();
      ctx.moveTo(0, r * 0.55);
      ctx.quadraticCurveTo(r * 0.2, r * 1.1, -r * 0.15, r * 1.5);
      ctx.stroke();
      ctx.fillStyle = '#20222A';
      circle(-r * 0.22, -r * 0.18, r * 0.08); ctx.fill();
      circle(r * 0.22, -r * 0.18, r * 0.08); ctx.fill();
    } else if (kind === 'krebs') {
      ctx.fillStyle = '#E8654C';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 0, r * 0.8, r * 0.58, 0, 0, 6.2832);
      else ctx.arc(0, 0, r * 0.7, 0, 6.2832);
      ctx.fill();
      ctx.strokeStyle = '#E8654C';
      ctx.lineWidth = r * 0.14;
      for (var lg = 0; lg < 3; lg++) {
        var lx = -r * 0.4 + lg * r * 0.4;
        ctx.beginPath();
        ctx.moveTo(lx, r * 0.4); ctx.lineTo(lx - r * 0.15, r * 0.9);
        ctx.stroke();
      }
      ctx.fillStyle = '#C74B36';
      circle(-r * 0.95, -r * 0.35, r * 0.28); ctx.fill();
      circle(r * 0.95, -r * 0.35, r * 0.28); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      circle(-r * 0.25, -r * 0.22, r * 0.16); ctx.fill();
      circle(r * 0.25, -r * 0.22, r * 0.16); ctx.fill();
      ctx.fillStyle = '#20222A';
      circle(-r * 0.25, -r * 0.22, r * 0.08); ctx.fill();
      circle(r * 0.25, -r * 0.22, r * 0.08); ctx.fill();
    } else if (kind === 'oktopus') {
      ctx.strokeStyle = '#C77BDE';
      ctx.lineWidth = r * 0.20;
      for (var tn = 0; tn < 5; tn++) {
        var tx = -r * 0.6 + tn * r * 0.3;
        ctx.beginPath();
        ctx.moveTo(tx, r * 0.25);
        ctx.quadraticCurveTo(tx + Math.sin(S.t * 3 + tn) * r * 0.3, r * 0.8, tx, r * 1.2);
        ctx.stroke();
      }
      ctx.fillStyle = '#C77BDE';
      circle(0, -r * 0.15, r * 0.75); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      circle(-r * 0.28, -r * 0.25, r * 0.20); ctx.fill();
      circle(r * 0.28, -r * 0.25, r * 0.20); ctx.fill();
      ctx.fillStyle = '#20222A';
      circle(-r * 0.26, -r * 0.25, r * 0.10); ctx.fill();
      circle(r * 0.30, -r * 0.25, r * 0.10); ctx.fill();
    } else if (kind === 'seestern') {
      ctx.fillStyle = '#F58B9C';
      ctx.beginPath();
      for (var st = 0; st < 10; st++) {
        var sa = -1.5708 + st * 0.6283;
        var sr = (st % 2 === 0) ? r * 1.0 : r * 0.42;
        var sxp = Math.cos(sa) * sr, syp = Math.sin(sa) * sr;
        if (st === 0) ctx.moveTo(sxp, syp); else ctx.lineTo(sxp, syp);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#20222A';
      circle(-r * 0.18, -r * 0.10, r * 0.08); ctx.fill();
      circle(r * 0.18, -r * 0.10, r * 0.08); ctx.fill();
    } else {
      ctx.fillStyle = '#5C87B8';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 0, r * 1.15, r * 0.65, 0, 0, 6.2832);
      else ctx.arc(0, 0, r, 0, 6.2832);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-r * 1.0, 0); ctx.lineTo(-r * 1.5, -r * 0.45);
      ctx.lineTo(-r * 1.25, 0); ctx.lineTo(-r * 1.5, r * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#BFE3F5';
      ctx.lineWidth = r * 0.12;
      ctx.beginPath();
      ctx.moveTo(r * 0.4, -r * 0.6);
      ctx.quadraticCurveTo(r * 0.55, -r * 1.1, r * 0.3, -r * 1.3);
      ctx.stroke();
      ctx.fillStyle = '#20222A';
      circle(r * 0.75, -r * 0.15, r * 0.09); ctx.fill();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- Faehigkeits-Symbole

  function drawAbilIcon(key, x, y, r, col) {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = col;
    ctx.fillStyle = col;

    if (key === 'sog') {
      ctx.lineWidth = r * 0.20;
      ctx.beginPath();
      for (var a = 0; a < 12; a++) {
        var t = a / 11 * 6.2832 * 1.6;
        var rr = r * 0.15 + (r * 0.75) * (a / 11);
        var px = Math.cos(t) * rr, py = Math.sin(t) * rr;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    } else if (key === 'turbo') {
      ctx.lineWidth = r * 0.22;
      for (var i = 0; i < 3; i++) {
        var ox = -r * 0.5 + i * r * 0.45;
        ctx.beginPath();
        ctx.moveTo(ox - r * 0.15, -r * 0.5);
        ctx.lineTo(ox + r * 0.25, 0);
        ctx.lineTo(ox - r * 0.15, r * 0.5);
        ctx.stroke();
      }
    } else if (key === 'blase') {
      ctx.lineWidth = r * 0.18;
      circle(0, 0, r * 0.72); ctx.stroke();
      ctx.globalAlpha = 0.35;
      circle(0, 0, r * 0.72); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#FFFFFF';
      circle(-r * 0.28, -r * 0.32, r * 0.16); ctx.fill();
    } else if (key === 'begleiter') {
      drawFish({ x: -r * 0.30, y: -r * 0.22, r: r * 0.30, dir: 1, col: col });
      drawFish({ x: r * 0.28, y: r * 0.30, r: r * 0.24, dir: 1, col: col });
    } else if (key === 'maul') {
      ctx.lineWidth = r * 0.16;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0.5, 5.0); ctx.stroke();
      ctx.beginPath();
      for (var m = 0; m < 5; m++) {
        var ma = 0.9 + m * 0.72;
        var bx = Math.cos(ma) * r * 0.62, by = Math.sin(ma) * r * 0.62;
        ctx.moveTo(bx, by);
        ctx.lineTo(Math.cos(ma) * r * 0.30, Math.sin(ma) * r * 0.30);
      }
      ctx.lineWidth = r * 0.12;
      ctx.stroke();
    } else if (key === 'elektro') {
      ctx.beginPath();
      ctx.moveTo(r * 0.20, -r * 0.75);
      ctx.lineTo(-r * 0.35, r * 0.08);
      ctx.lineTo(r * 0.02, r * 0.08);
      ctx.lineTo(-r * 0.18, r * 0.78);
      ctx.lineTo(r * 0.42, -r * 0.08);
      ctx.lineTo(r * 0.05, -r * 0.08);
      ctx.closePath(); ctx.fill();
    } else if (key === 'ruf') {
      ctx.lineWidth = r * 0.16;
      for (var w = 0; w < 3; w++) {
        ctx.beginPath();
        ctx.arc(-r * 0.45, 0, r * (0.30 + w * 0.28), -0.9, 0.9);
        ctx.stroke();
      }
      drawFish({ x: r * 0.45, y: 0, r: r * 0.26, dir: -1, col: col });
    } else if (key === 'welle') {
      ctx.lineWidth = r * 0.17;
      for (var wl = 0; wl < 3; wl++) {
        ctx.beginPath();
        ctx.moveTo(-r * 0.75, -r * 0.4 + wl * r * 0.42);
        ctx.quadraticCurveTo(-r * 0.25, -r * 0.75 + wl * r * 0.42, 0, -r * 0.4 + wl * r * 0.42);
        ctx.quadraticCurveTo(r * 0.3, -r * 0.05 + wl * r * 0.42, r * 0.75, -r * 0.4 + wl * r * 0.42);
        ctx.stroke();
      }
    } else if (key === 'peitsche') {
      ctx.lineWidth = r * 0.18;
      ctx.beginPath();
      ctx.moveTo(-r * 0.75, r * 0.6);
      ctx.quadraticCurveTo(r * 0.1, r * 0.1, r * 0.2, -r * 0.75);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r * 0.2, -r * 0.75);
      ctx.lineTo(r * 0.68, -r * 0.42);
      ctx.stroke();
    } else if (key === 'tarnung') {
      ctx.lineWidth = r * 0.16;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.68, -0.6, 3.3);
      ctx.stroke();
      ctx.globalAlpha = 0.35;
      circle(0, 0, r * 0.68); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#FFFFFF';
      circle(r * 0.2, -r * 0.15, r * 0.13); ctx.fill();
    } else if (key === 'schwarm') {
      drawFish({ x: -r * 0.35, y: -r * 0.40, r: r * 0.26, dir: 1, col: col });
      drawFish({ x: r * 0.30, y: -r * 0.02, r: r * 0.24, dir: 1, col: col });
      drawFish({ x: -r * 0.20, y: r * 0.48, r: r * 0.22, dir: 1, col: col });
    } else if (key === 'panzer') {
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.78);
      ctx.lineTo(r * 0.66, -r * 0.42);
      ctx.lineTo(r * 0.50, r * 0.50);
      ctx.lineTo(0, r * 0.80);
      ctx.lineTo(-r * 0.50, r * 0.50);
      ctx.lineTo(-r * 0.66, -r * 0.42);
      ctx.closePath();
      ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
      ctx.lineWidth = r * 0.16; ctx.stroke();
      ctx.strokeStyle = '#3A2C1E';
      ctx.lineWidth = r * 0.14;
      ctx.beginPath();
      ctx.moveTo(-r * 0.10, -r * 0.60);
      ctx.lineTo(r * 0.14, -r * 0.10);
      ctx.lineTo(-r * 0.16, r * 0.18);
      ctx.lineTo(r * 0.10, r * 0.62);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Zeigt in einer kleinen Schleife, was die Faehigkeit tut.
  // Ein Kind, das nicht liest, versteht Bewegung - kein Symbol.
  function drawAbilDemo(key, x, y, r, col) {
    var ph = (S.t % 2.2) / 2.2;          // 0..1, laeuft in Schleife
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function hai(hx, hy, hr, dir) {
      drawShark(hx, hy, hr, dir > 0 ? 0 : Math.PI,
                SHARKS[S.sharkIdx], { tail: Math.sin(S.t * 6) });
    }
    function fischchen(fx, fy, fr, dir, c) {
      drawFish({ x: fx, y: fy, r: fr, dir: dir, col: c || '#FFB13D', kind: 'klein', ph: 0 });
    }

    if (key === 'sog') {
      hai(r * 0.35, 0, r * 0.9, 1);
      for (var i = 0; i < 3; i++) {
        var t1 = (ph + i / 3) % 1;
        var a1 = -0.9 + i * 0.9;
        var d1 = r * (1.05 - 0.75 * t1);
        fischchen(r * 0.35 + Math.cos(a1) * d1, Math.sin(a1) * d1, r * 0.16, -1);
      }
    } else if (key === 'turbo') {
      var tx = -r * 0.9 + ph * r * 1.7;
      hai(tx, 0, r * 0.85, 1);
      ctx.strokeStyle = col; ctx.lineWidth = r * 0.10;
      for (var l = -1; l <= 1; l++) {
        ctx.beginPath();
        ctx.moveTo(tx - r * 0.75, l * r * 0.28);
        ctx.lineTo(tx - r * 0.45 - r * 0.25 * ph, l * r * 0.28);
        ctx.stroke();
      }
    } else if (key === 'blase') {
      hai(-r * 0.15, 0, r * 0.85, 1);
      ctx.strokeStyle = col; ctx.lineWidth = r * 0.10;
      circle(-r * 0.15, 0, r * 0.62); ctx.stroke();
      var qx = r * 1.0 - Math.min(ph, 0.5) * r * 1.1 + Math.max(0, ph - 0.5) * r * 1.6;
      drawHazard({ kind: 'jelly', x: qx, y: -r * 0.1, r: r * 0.28, ph: 0, off: ph > 0.5 ? 1 : 0 });
      if (ph > 0.45 && ph < 0.62) {
        ctx.fillStyle = '#FFFFFF';
        circle(r * 0.5, -r * 0.1, r * 0.14); ctx.fill();
      }
    } else if (key === 'begleiter') {
      hai(0, 0, r * 0.8, 1);
      for (var b2 = 0; b2 < 2; b2++) {
        var ab2 = S.t * 2 + b2 * 3.14;
        fischchen(Math.cos(ab2) * r * 0.8, Math.sin(ab2) * r * 0.55, r * 0.18, Math.cos(ab2) > 0 ? 1 : -1, '#FF9E3D');
      }
    } else if (key === 'maul') {
      var open = 0.35 + Math.abs(Math.sin(ph * 3.14)) * 0.65;
      ctx.strokeStyle = col; ctx.lineWidth = r * 0.14;
      ctx.beginPath(); ctx.arc(-r * 0.2, 0, r * 0.85, -0.3 - open, -0.3 + 0.15); ctx.stroke();
      ctx.beginPath(); ctx.arc(-r * 0.2, 0, r * 0.85, 0.3 - 0.15, 0.3 + open); ctx.stroke();
      ctx.fillStyle = col;
      for (var z2 = 0; z2 < 4; z2++) {
        var az = -0.3 - open + z2 * (open / 3);
        ctx.beginPath();
        ctx.moveTo(-r * 0.2 + Math.cos(az) * r * 0.78, Math.sin(az) * r * 0.78);
        ctx.lineTo(-r * 0.2 + Math.cos(az) * r * 0.52, Math.sin(az) * r * 0.52);
        ctx.lineTo(-r * 0.2 + Math.cos(az + 0.14) * r * 0.78, Math.sin(az + 0.14) * r * 0.78);
        ctx.closePath(); ctx.fill();
      }
      if (ph < 0.6) fischchen(r * 0.75 - ph * r * 0.9, 0, r * 0.20, -1);
    } else if (key === 'elektro') {
      hai(-r * 0.2, 0, r * 0.85, 1);
      var jx = r * 0.95 - Math.min(ph, 0.45) * r * 1.0 + Math.max(0, ph - 0.45) * r * 1.8;
      drawHazard({ kind: 'jelly', x: jx, y: -r * 0.05, r: r * 0.28, ph: 0, off: ph > 0.45 ? 1 : 0 });
      if (ph > 0.40 && ph < 0.60) {
        ctx.fillStyle = '#C6A0FF';
        for (var sp3 = 0; sp3 < 5; sp3++) {
          var sa3 = sp3 * 1.25 + S.t * 6;
          circle(r * 0.45 + Math.cos(sa3) * r * 0.3, Math.sin(sa3) * r * 0.3, r * 0.07); ctx.fill();
        }
      }
    } else if (key === 'ruf') {
      // links wenige, rechts viele - der Vergleich erklaert es
      var bob2 = Math.sin(S.t * 3) * r * 0.05;
      fischchen(-r * 0.72, -r * 0.20 + bob2, r * 0.17, 1, '#FFB13D');
      fischchen(-r * 0.50, r * 0.28 - bob2, r * 0.17, 1, '#FFB13D');
      ctx.strokeStyle = col; ctx.lineWidth = r * 0.13;
      var apx = -r * 0.02 + Math.sin(S.t * 3) * r * 0.06;
      ctx.beginPath();
      ctx.moveTo(apx - r * 0.16, 0); ctx.lineTo(apx + r * 0.16, 0);
      ctx.moveTo(apx + r * 0.02, -r * 0.16); ctx.lineTo(apx + r * 0.18, 0);
      ctx.lineTo(apx + r * 0.02, r * 0.16);
      ctx.stroke();
      var many = [[0.45, -0.55], [0.80, -0.30], [0.45, 0.02], [0.85, 0.22], [0.48, 0.52], [0.82, 0.72]];
      for (var mf = 0; mf < many.length; mf++) {
        fischchen(r * many[mf][0], r * many[mf][1] + Math.sin(S.t * 3 + mf) * r * 0.05,
                  r * 0.17, 1, '#FFB13D');
      }
    } else if (key === 'panzer') {
      // Boss mit Plattenring, der Hai schlaegt eine heraus
      var bx3 = r * 0.30, by3 = -r * 0.10;
      drawBossBody({ kind: 'muschel', x: bx3, y: by3, r: r * 0.40, tired: 0 });
      var weg = ph > 0.55;
      for (var pl2 = 0; pl2 < 6; pl2++) {
        var ap2 = (6.2832 / 6) * pl2 + S.t * 0.5;
        var fly = (pl2 === 2 && weg) ? (ph - 0.55) * r * 1.4 : 0;
        if (pl2 === 2 && ph > 0.85) continue;
        ctx.save();
        ctx.translate(bx3 + Math.cos(ap2) * (r * 0.70 + fly), by3 + Math.sin(ap2) * (r * 0.70 + fly));
        ctx.rotate(ap2 + 1.5708);
        ctx.fillStyle = (pl2 === 2 && ph > 0.45 && ph < 0.58) ? '#FFFFFF' : '#E8E0C8';
        roundRect(-r * 0.20, -r * 0.11, r * 0.40, r * 0.22, r * 0.07); ctx.fill();
        ctx.restore();
      }
      var hxp = -r * 0.95 + Math.min(0.55, ph) * r * 1.10;
      hai(hxp, r * 0.30, r * 0.75, 1);
      if (ph > 0.45 && ph < 0.70) {
        ctx.fillStyle = '#FFF3B0';
        for (var fk2 = 0; fk2 < 5; fk2++) {
          var fa2 = fk2 * 1.25 + S.t * 8;
          circle(bx3 + Math.cos(fa2) * r * 0.5, by3 + Math.sin(fa2) * r * 0.5, r * 0.07); ctx.fill();
        }
      }
    } else {
      drawAbilIcon(key, 0, 0, r * 0.8, col);
    }
    ctx.restore();
  }

  function abilCol(key) {
    for (var i = 0; i < ABILS.length; i++) if (ABILS[i].key === key) return ABILS[i].col;
    return '#FFFFFF';
  }

  // Perlenreihe: gefuellte Perlen = Stufe
  function drawPearls(x, y, level, max, r, col) {
    var gap = r * 2.6;
    var startX = x - (max - 1) * gap / 2;
    for (var i = 0; i < max; i++) {
      var px = startX + i * gap;
      if (i < level) {
        ctx.fillStyle = col;
        circle(px, y, r); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        circle(px - r * 0.3, y - r * 0.3, r * 0.28); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 2;
        circle(px, y, r); ctx.stroke();
      }
    }
  }

  // ---------------------------------------------------------------- Szene

  var shark = { x: 0, y: 0, ang: 0, mouth: 0, stun: 0, tail: 0, shield: 0, shieldT: 0, pop: 0 };
  var target = null;
  var fishes = [], hazards = [], parts = [], bubbles = [], buddies = [];
  var boss = null;
  var shake = 0;        // kurzer Bildruck beim Zubeissen
  var helper = null;    // befreites Tier, das mittaucht
  var rufenWar = false;

  function spawnFish(atEdge) {
    var sc = sharkScale();
    var kd = pickFishKind();
    var r = (8.5 + Math.random() * 4) * (0.75 + 0.28 * sc) * kd.rr;
    var dir = Math.random() < 0.5 ? 1 : -1;
    fishes.push({
      x: atEdge ? (dir > 0 ? -50 : W + 50) : 40 + Math.random() * (W - 80),
      y: 80 + Math.random() * (H - 200),
      r: r, dir: dir,
      kind: kd.id, val: kd.val,
      sp: (20 + Math.random() * 24) * kd.sp,
      col: kd.col,
      ph: Math.random() * 6.28
    });
  }

  function fishTarget() { return 8 + lvl('ruf') * 2; }

  function addHazard(kind) {
    if (kind === 'jelly') {
      hazards.push({ kind: 'jelly', x: 60 + Math.random() * (W - 120), y: 120 + Math.random() * (H - 260),
                     r: 26, ph: Math.random() * 6.28, vy: 12 + Math.random() * 10, dirY: 1, off: 0 });
    } else if (kind === 'net') {
      hazards.push({ kind: 'net', x: 70 + Math.random() * (W - 160), y: 140 + Math.random() * (H - 300),
                     w: 96, h: 74, r: 48, vx: (Math.random() < 0.5 ? -1 : 1) * 10, off: 0 });
    } else if (kind === 'hook') {
      hazards.push({ kind: 'hook', x: 60 + Math.random() * (W - 120), y: 140 + Math.random() * (H * 0.4),
                     r: 20, ph: Math.random() * 6.28, off: 0 });
    } else if (kind === 'strudel') {
      hazards.push({ kind: 'strudel', x: 80 + Math.random() * (W - 160), y: 150 + Math.random() * (H - 300),
                     r: 44, rot: Math.random() * 6.28, vx: (Math.random() < 0.5 ? -1 : 1) * 14, off: 0 });
    } else if (kind === 'bigshark') {
      var d = Math.random() < 0.5 ? 1 : -1;
      hazards.push({ kind: 'bigshark', x: d > 0 ? -160 : W + 160, y: 140 + Math.random() * (H - 300),
                     r: 52, dir: d, sp: 62, off: 0 });
    }
  }

  function spawnHazards() {
    hazards = [];
    var kind = levelDef(S.stage).haz;   // immer nur eine Art, und immer gleich viele
    if (kind === 'none') return;
    var n = (kind === 'bigshark' ? 1 : 2);
    for (var j = 0; j < n; j++) addHazard(kind);
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, sp = 40 + Math.random() * 120;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                   life: 0.5 + Math.random() * 0.4, t: 0, r: 2 + Math.random() * 4, col: col });
    }
  }

  function startDive() {
    S.screen = 'game';
    S.diveFish = 0;
    S.cardIdx = 0;
    S.ab = {};
    for (var k in S.boni) { if (S.boni.hasOwnProperty(k)) S.ab[k] = S.boni[k]; }

    // Passive des gewaehlten Hais, sofern sie eine normale Faehigkeit ist
    var pa = myAbil();
    if (pa.pass === 'turbo' || pa.pass === 'maul' || pa.pass === 'sog' ||
        pa.pass === 'panzer' || pa.pass === 'begleiter' || pa.pass === 'blase') {
      S.ab[pa.pass] = Math.max(S.ab[pa.pass] || 0, pa.lv);
    }

    // angefangener Tauchgang derselben Tiefe und desselben Hais wird fortgesetzt
    if (S.dive && S.dive.depth === S.stage && S.dive.shark === S.sharkIdx) {
      S.diveFish = S.dive.fish;
      S.cardIdx = S.dive.card || 0;
      S.ab = S.dive.ab;
    }
    S.dive = null;
    S.actT = 0;
    S.fx = { intro: 3.2 };
    ring = null;
    trail = [];
    shark.x = W * 0.5; shark.y = H * 0.5; shark.ang = 0;
    shark.stun = 0; shark.mouth = 0;
    shark.shield = lvl('blase') > 0 ? 1 : 0;
    shark.shieldT = 0;
    target = null;
    fishes = []; parts = []; boss = null;
    syncBuddies();
    helper = null;
    if (totalFriends() && Math.random() < 0.55) {
      helper = { idx: friendAt(Math.floor(Math.random() * totalFriends())),
                 x: W * 0.5, y: H * 0.5, ph: Math.random() * 6.28 };
    }
    for (var i = 0; i < fishTarget(); i++) spawnFish(false);
    spawnHazards();
  }

  // Zwischenstand des Tauchgangs wegschreiben, damit nichts verlorengeht
  function stashDive() {
    if (S.screen !== 'game' && S.screen !== 'cards') return;
    S.dive = { depth: S.stage, shark: S.sharkIdx, fish: S.diveFish, card: S.cardIdx, ab: S.ab };
    saveProfile();
  }

  function syncBuddies() {
    var n = lvl('begleiter') + (S.fx.rufen > 0 ? 3 : 0);
    buddies = [];
    for (var i = 0; i < n; i++) {
      buddies.push({ ph: (6.2832 / Math.max(1, n)) * i, x: shark.x, y: shark.y,
                     col: FISH_COLORS[i % FISH_COLORS.length] });
    }
  }

  // ---------------------------------------------------------------- Boss

  function spawnBoss() {
    var setup = bossSetup(S.stage);
    var plates = [];
    var n = 8;
    for (var i = 0; i < n; i++) {
      plates.push({ a: (6.2832 / n) * i, hp: 2, alive: true, flash: 0 });
    }
    boss = {
      kind: setup.body,
      armor: setup.armor,
      move: setup.move,
      x: W * 0.5, y: H * 0.42,
      cx: W * 0.5, cy: H * 0.42,
      shieldAng: 1.5708,
      backoff: 0,
      vx: 34, vy: 22,
      rot: 0,
      r: 62,
      plateR: Math.max(64, Math.min(96, W * 0.21)),
      plates: plates,
      timer: 0,
      charge: 0,
      chargeT: 3.0,
      done: 0
    };
    sfxCrack();
    burst(boss.x, boss.y, '#FFFFFF', 26);
  }

  var _pp = { x: 0, y: 0 };
  function platePos(b, i) {
    var p = b.plates[i], a;
    if (b.armor === 'reihen') {
      var col = i % 4, row = i < 4 ? -1 : 1;
      _pp.x = b.x + (col - 1.5) * 40;
      _pp.y = b.y + row * b.plateR * 0.62;
    } else if (b.armor === 'schild') {
      var cc = i % 2, rr2 = Math.floor(i / 2);
      var sa2 = b.shieldAng || 0;
      var along = b.plateR * (0.78 + cc * 0.30);
      var across = (rr2 - 1.5) * 32;
      _pp.x = b.x + Math.cos(sa2) * along - Math.sin(sa2) * across;
      _pp.y = b.y + Math.sin(sa2) * along + Math.cos(sa2) * across;
    } else if (b.armor === 'kreuz') {
      a = 1.5708 * (i % 4) + b.rot * 1.7;
      var rad = (i < 4) ? b.plateR * 1.15 : b.plateR * 0.82;   // innen trotzdem ausserhalb des Koerpers
      _pp.x = b.x + Math.cos(a) * rad;
      _pp.y = b.y + Math.sin(a) * rad;
    } else {
      a = p.a + b.rot;
      _pp.x = b.x + Math.cos(a) * b.plateR;
      _pp.y = b.y + Math.sin(a) * b.plateR;
    }
    return _pp;
  }

  function platesLeft() {
    if (!boss) return 0;
    var n = 0;
    for (var i = 0; i < boss.plates.length; i++) if (boss.plates[i].alive) n++;
    return n;
  }

  function drawBossBody(b) {
    var k = b.kind;
    ctx.save();
    ctx.translate(b.x, b.y);
    if (k === 'muschel') {
      var op = 0.25 + Math.sin(S.t * 1.5) * 0.12;
      ctx.fillStyle = '#F2C9D8';
      ctx.save(); ctx.rotate(-op);
      ctx.beginPath(); ctx.arc(0, 0, b.r, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#E4A9C0';
      ctx.save(); ctx.rotate(op);
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#FFFFFF';
      circle(-b.r * 0.25, -b.r * 0.12, 7); ctx.fill();
      circle(b.r * 0.25, -b.r * 0.12, 7); ctx.fill();
      ctx.fillStyle = '#20222A';
      var em = 1 - (b.tired || 0) * 0.6;
      circle(-b.r * 0.25, -b.r * 0.12, 3.4 * em); ctx.fill();
      circle(b.r * 0.25, -b.r * 0.12, 3.4 * em); ctx.fill();
    } else if (k === 'krake') {
      ctx.strokeStyle = '#B06BC8';
      ctx.lineWidth = 12; ctx.lineCap = 'round';
      for (var i = 0; i < 6; i++) {
        var a = (6.2832 / 6) * i + Math.sin(S.t + i) * 0.2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * b.r * 0.5, Math.sin(a) * b.r * 0.5);
        ctx.quadraticCurveTo(Math.cos(a) * b.r * 1.3, Math.sin(a) * b.r * 1.3 + Math.sin(S.t * 2 + i) * 14,
                             Math.cos(a) * b.r * 1.7, Math.sin(a) * b.r * 1.7);
        ctx.stroke();
      }
      ctx.fillStyle = '#C77BDE';
      circle(0, -b.r * 0.15, b.r * 0.78); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      circle(-b.r * 0.28, -b.r * 0.25, 10); ctx.fill();
      circle(b.r * 0.28, -b.r * 0.25, 10); ctx.fill();
      ctx.fillStyle = '#20222A';
      var em2 = 1 - (b.tired || 0) * 0.6;
      circle(-b.r * 0.26, -b.r * 0.25, 5 * em2); ctx.fill();
      circle(b.r * 0.30, -b.r * 0.25, 5 * em2); ctx.fill();
    } else if (k === 'boot') {
      ctx.fillStyle = '#C7683F';
      ctx.beginPath();
      ctx.moveTo(-b.r, -b.r * 0.4);
      ctx.lineTo(b.r, -b.r * 0.4);
      ctx.lineTo(b.r * 0.7, b.r * 0.25);
      ctx.lineTo(-b.r * 0.7, b.r * 0.25);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8C4326';
      ctx.fillRect(-b.r * 0.2, -b.r * 1.1, b.r * 0.14, b.r * 0.7);
      ctx.strokeStyle = 'rgba(240,240,225,0.8)';
      ctx.lineWidth = 2;
      for (var gx = -b.r * 0.6; gx <= b.r * 0.6; gx += 14) {
        ctx.beginPath(); ctx.moveTo(gx, b.r * 0.25); ctx.lineTo(gx * 0.7, b.r * 1.0); ctx.stroke();
      }
      for (var gy = b.r * 0.35; gy <= b.r; gy += 14) {
        ctx.beginPath(); ctx.moveTo(-b.r * 0.62, gy); ctx.lineTo(b.r * 0.62, gy); ctx.stroke();
      }
    } else if (k === 'krabbe') {
      ctx.fillStyle = '#E8654C';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 0, b.r * 0.95, b.r * 0.68, 0, 0, 6.2832);
      else ctx.arc(0, 0, b.r * 0.8, 0, 6.2832);
      ctx.fill();
      ctx.strokeStyle = '#E8654C';
      ctx.lineWidth = b.r * 0.16;
      ctx.lineCap = 'round';
      for (var lg = -2; lg <= 2; lg++) {
        if (!lg) continue;
        ctx.beginPath();
        ctx.moveTo(lg * b.r * 0.30, b.r * 0.45);
        ctx.lineTo(lg * b.r * 0.42, b.r * 1.05 + Math.sin(S.t * 3 + lg) * 5);
        ctx.stroke();
      }
      ctx.fillStyle = '#C74B36';
      var cl = Math.sin(S.t * 2) * 0.2;
      ctx.save(); ctx.translate(-b.r * 1.05, -b.r * 0.32); ctx.rotate(cl);
      circle(0, 0, b.r * 0.32); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(b.r * 1.05, -b.r * 0.32); ctx.rotate(-cl);
      circle(0, 0, b.r * 0.32); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#FFFFFF';
      circle(-b.r * 0.26, -b.r * 0.26, b.r * 0.16); ctx.fill();
      circle(b.r * 0.26, -b.r * 0.26, b.r * 0.16); ctx.fill();
      ctx.fillStyle = '#20222A';
      var em3 = 1 - (b.tired || 0) * 0.6;
      circle(-b.r * 0.26, -b.r * 0.26, b.r * 0.08 * em3); ctx.fill();
      circle(b.r * 0.26, -b.r * 0.26, b.r * 0.08 * em3); ctx.fill();
    } else if (k === 'angler') {
      ctx.strokeStyle = '#7A6B58';
      ctx.lineWidth = b.r * 0.07;
      ctx.beginPath();
      ctx.moveTo(0, -b.r * 0.55);
      ctx.quadraticCurveTo(b.r * 0.5, -b.r * 1.35, b.r * 0.85, -b.r * 1.05);
      ctx.stroke();
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.sin(S.t * 5) * 0.25;
      ctx.fillStyle = '#FFF3B0';
      circle(b.r * 0.85, -b.r * 1.05, b.r * 0.30); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#FFE066';
      circle(b.r * 0.85, -b.r * 1.05, b.r * 0.13); ctx.fill();
      ctx.fillStyle = '#4E5A64';
      circle(0, 0, b.r * 0.85); ctx.fill();
      ctx.fillStyle = '#2A3138';
      ctx.beginPath();
      ctx.moveTo(-b.r * 0.72, b.r * 0.22);
      ctx.quadraticCurveTo(0, b.r * 0.75, b.r * 0.72, b.r * 0.22);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      for (var tz = -2; tz <= 2; tz++) {
        ctx.beginPath();
        ctx.moveTo(tz * b.r * 0.22 - b.r * 0.06, b.r * 0.30);
        ctx.lineTo(tz * b.r * 0.22, b.r * 0.52);
        ctx.lineTo(tz * b.r * 0.22 + b.r * 0.06, b.r * 0.30);
        ctx.closePath(); ctx.fill();
      }
      circle(-b.r * 0.30, -b.r * 0.22, b.r * 0.17); ctx.fill();
      circle(b.r * 0.30, -b.r * 0.22, b.r * 0.17); ctx.fill();
      ctx.fillStyle = '#20222A';
      var em4 = 1 - (b.tired || 0) * 0.6;
      circle(-b.r * 0.30, -b.r * 0.22, b.r * 0.09 * em4); ctx.fill();
      circle(b.r * 0.30, -b.r * 0.22, b.r * 0.09 * em4); ctx.fill();
    } else if (k === 'kalmar') {
      ctx.fillStyle = '#8E6BC8';
      ctx.beginPath();
      ctx.moveTo(0, -b.r * 1.25);
      ctx.quadraticCurveTo(b.r * 0.72, -b.r * 0.2, b.r * 0.5, b.r * 0.35);
      ctx.lineTo(-b.r * 0.5, b.r * 0.35);
      ctx.quadraticCurveTo(-b.r * 0.72, -b.r * 0.2, 0, -b.r * 1.25);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#A87EDE';
      ctx.lineWidth = b.r * 0.13;
      ctx.lineCap = 'round';
      for (var ta = 0; ta < 8; ta++) {
        var tx2 = -b.r * 0.44 + ta * b.r * 0.125;
        ctx.beginPath();
        ctx.moveTo(tx2, b.r * 0.35);
        ctx.quadraticCurveTo(tx2 + Math.sin(S.t * 2.6 + ta) * b.r * 0.35, b.r * 0.95,
                             tx2 + Math.sin(S.t * 2.6 + ta) * b.r * 0.2, b.r * 1.5);
        ctx.stroke();
      }
      ctx.fillStyle = '#FFFFFF';
      circle(-b.r * 0.26, -b.r * 0.10, b.r * 0.19); ctx.fill();
      circle(b.r * 0.26, -b.r * 0.10, b.r * 0.19); ctx.fill();
      ctx.fillStyle = '#20222A';
      var em5 = 1 - (b.tired || 0) * 0.6;
      circle(-b.r * 0.26, -b.r * 0.10, b.r * 0.10 * em5); ctx.fill();
      circle(b.r * 0.26, -b.r * 0.10, b.r * 0.10 * em5); ctx.fill();
    } else if (k === 'uboot') {
      ctx.fillStyle = '#5A6B72';
      roundRect(-b.r * 1.05, -b.r * 0.45, b.r * 2.1, b.r * 0.9, b.r * 0.45); ctx.fill();
      ctx.fillStyle = '#46545A';
      roundRect(-b.r * 0.22, -b.r * 0.92, b.r * 0.48, b.r * 0.5, b.r * 0.12); ctx.fill();
      ctx.strokeStyle = '#46545A';
      ctx.lineWidth = b.r * 0.09;
      ctx.beginPath();
      ctx.moveTo(b.r * 0.05, -b.r * 0.92); ctx.lineTo(b.r * 0.05, -b.r * 1.25);
      ctx.stroke();
      ctx.fillStyle = '#BFE3F5';
      circle(-b.r * 0.45, 0, b.r * 0.20); ctx.fill();
      circle(b.r * 0.45, 0, b.r * 0.20); ctx.fill();
      ctx.fillStyle = '#20222A';
      var em6 = 1 - (b.tired || 0) * 0.6;
      circle(b.r * 0.45, 0, b.r * 0.10 * em6); ctx.fill();
      ctx.strokeStyle = '#8FA0A8';
      ctx.lineWidth = b.r * 0.07;
      circle(-b.r * 0.45, 0, b.r * 0.20); ctx.stroke();
      circle(b.r * 0.45, 0, b.r * 0.20); ctx.stroke();
    } else {
      drawShark(0, 0, b.r * 3.2, Math.sin(S.t * 0.5) > 0 ? 0 : Math.PI,
                { body: '#2B3138', belly: '#F4F6F8', shape: 'normal', pattern: 'none' },
                { tail: Math.sin(S.t * 4) });
    }
    ctx.restore();
  }

  function drawBoss(b) {
    var give = b.done > 0 ? Math.min(1, b.done / 1.2) : 0;
    ctx.save();
    if (give > 0) {
      ctx.globalAlpha = 1 - give * 0.9;
      ctx.translate(b.x, b.y + give * 60);
      ctx.scale(1 - give * 0.4, 1 - give * 0.4);
      ctx.translate(-b.x, -b.y);
    }
    drawBossBody(b);
    for (var i = 0; i < b.plates.length; i++) {
      var p = b.plates[i];
      if (!p.alive) continue;
      var pp = platePos(b, i);
      var px = pp.x, py = pp.y;
      var a = Math.atan2(py - b.y, px - b.x);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a + Math.PI / 2);
      var dmg = 1 - p.hp / 2;
      ctx.fillStyle = p.flash > 0 ? '#FFFFFF' : (dmg > 0.6 ? '#9C8F72' : (dmg > 0.3 ? '#BFB393' : '#E8E0C8'));
      roundRect(-24, -13, 48, 26, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(60,50,35,0.5)';
      ctx.lineWidth = 2;
      roundRect(-24, -13, 48, 26, 8); ctx.stroke();
      if (p.hp <= 1) {
        ctx.strokeStyle = 'rgba(50,40,28,0.7)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-8, -10); ctx.lineTo(2, 0); ctx.lineTo(-6, 8);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- Karten

  function pickCards() {
    var pool = [];
    var haz = levelDef(S.stage).haz;
    for (var i = 0; i < ABILS.length; i++) {
      var k = ABILS[i].key;
      if (lvl(k) >= MAX_LEVEL) continue;
      // In einer Tiefe ohne Gefahr wuerden diese beiden nichts tun
      if (haz === 'none' && (k === 'elektro' || k === 'blase')) continue;
      pool.push(k);
    }
    if (pool.length === 0) return [];
    var out = [];
    // erste Karte bevorzugt etwas Neues, zweite etwas Bekanntes
    var fresh = [], known = [];
    for (var j = 0; j < pool.length; j++) {
      if (lvl(pool[j]) === 0) fresh.push(pool[j]); else known.push(pool[j]);
    }
    function take(arr) {
      if (!arr.length) return null;
      return arr.splice(Math.floor(Math.random() * arr.length), 1)[0];
    }
    var a = take(fresh);
    if (a === null) a = take(known);
    var b = take(known);
    if (b === null) b = take(fresh);
    if (a !== null) out.push(a);
    if (b !== null) out.push(b);
    return out;
  }

  function openCards() {
    var c = pickCards();
    if (c.length === 0) return;
    S.cards = c;
    S.screen = 'cards';
    sfxCard();
  }

  function applyCard(key) {
    S.ab[key] = Math.min(MAX_LEVEL, lvl(key) + 1);
    if (key === 'begleiter') syncBuddies();
    if (key === 'blase' && shark.shield === 0) shark.shield = 1;
    if (key === 'ruf') { while (fishes.length < fishTarget()) spawnFish(true); }
    S.screen = 'game';
    sfxTap();
  }

  // ---------------------------------------------------------------- Update

  function update(dt) {
    S.t += dt;

    if (bubbles.length < 18 && Math.random() < dt * 6) {
      bubbles.push({ x: Math.random() * W, y: H + 10, r: 2 + Math.random() * 5,
                     sp: 20 + Math.random() * 30, ph: Math.random() * 6.28 });
    }
    for (var b = bubbles.length - 1; b >= 0; b--) {
      var bb = bubbles[b];
      bb.y -= bb.sp * dt;
      bb.x += Math.sin(S.t * 2 + bb.ph) * 8 * dt;
      if (bb.y < -20) bubbles.splice(b, 1);
    }
    for (var p = parts.length - 1; p >= 0; p--) {
      var pa = parts[p];
      pa.t += dt;
      pa.x += pa.vx * dt; pa.y += pa.vy * dt;
      pa.vy -= 30 * dt; pa.vx *= 0.96; pa.vy *= 0.96;
      if (pa.t >= pa.life) parts.splice(p, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 22);

    if (S.screen !== 'game') { shake = 0; return; }

    var sc = sharkScale();
    var len = 82 * sc;
    var biteLen = 82 * Math.min(sharkScale(), BITE_CAP);
    var bite = biteLen * 0.34 * (1 + 0.18 * lvl('maul'));
    if (hasPass('filter')) bite *= 1.30;              // Walhai: breiterer Schluckbereich
    if (S.fx.riesenbiss > 0) bite *= 2;
    var speedMul = 1 + 0.14 * lvl('turbo');
    if (hasPass('sprint')) speedMul += 0.14;          // Schwarzspitzenhai
    if (S.fx.rakete > 0 || S.fx.doppelsprint > 0) speedMul *= 2.2;

    // Abklingzeit und laufende Effekte
    if (S.actT > 0) S.actT = Math.max(0, S.actT - dt);
    for (var fk in S.fx) {
      if (S.fx.hasOwnProperty(fk) && S.fx[fk] > 0) S.fx[fk] = Math.max(0, S.fx[fk] - dt);
    }
    if (rufenWar && !(S.fx.rufen > 0)) { rufenWar = false; syncBuddies(); }
    if (S.fx.rufen > 0) rufenWar = true;
    if (ring) { ring.t += dt; if (ring.t > 0.75) ring = null; }
    if (S.fx.rakete > 0 || S.fx.doppelsprint > 0) {
      trail.push({ x: shark.x, y: shark.y, t: 0 });
      if (trail.length > 22) trail.shift();
    }
    for (var tr = trail.length - 1; tr >= 0; tr--) {
      trail[tr].t += dt;
      if (trail[tr].t > 0.5) trail.splice(tr, 1);
    }
    if (shark.pop > 0) shark.pop = Math.max(0, shark.pop - dt * 4);

    if (shark.stun > 0) shark.stun = Math.max(0, shark.stun - dt);

    // Schutzblase laedt nach
    if (lvl('blase') > 0 && shark.shield === 0) {
      shark.shieldT += dt;
      var need = 13 - 2 * lvl('blase');
      if (shark.shieldT >= need) { shark.shield = 1; shark.shieldT = 0; sfxShield(); }
    }

    var desiredAng = shark.ang;
    var speed = 62 * speedMul;
    if (shark.stun > 0) {
      speed = 26;
      desiredAng = shark.ang + Math.sin(S.t * 14) * 0.5;
    } else if (target) {
      var tx = target.fish ? target.fish.x : target.x;
      var ty = target.fish ? target.fish.y : target.y;
      var dx = tx - shark.x, dy = ty - shark.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      desiredAng = Math.atan2(dy, dx);
      speed = (100 + Math.min(190, d * 1.2)) * speedMul;
      if (!target.fish && d < 26) target = null;
    } else {
      desiredAng = shark.ang + Math.sin(S.t * 0.6) * 1.5 * dt;
    }

    var diff = desiredAng - shark.ang;
    while (diff > Math.PI) diff -= 6.2832;
    while (diff < -Math.PI) diff += 6.2832;
    shark.ang += diff * Math.min(1, dt * (shark.stun > 0 ? 3 : 7));
    shark.x += Math.cos(shark.ang) * speed * dt;
    shark.y += Math.sin(shark.ang) * speed * dt;
    shark.tail = Math.sin(S.t * (speed > 120 ? 12 : 5));

    var m = 40;
    if (shark.x < m) { shark.x = m; shark.ang = Math.atan2(Math.sin(shark.ang), Math.abs(Math.cos(shark.ang))); target = null; }
    if (shark.x > W - m) { shark.x = W - m; shark.ang = Math.atan2(Math.sin(shark.ang), -Math.abs(Math.cos(shark.ang))); target = null; }
    if (shark.y < m + 42) { shark.y = m + 42; shark.ang = Math.atan2(Math.abs(Math.sin(shark.ang)), Math.cos(shark.ang)); target = null; }
    if (shark.y > H - m) { shark.y = H - m; shark.ang = Math.atan2(-Math.abs(Math.sin(shark.ang)), Math.cos(shark.ang)); target = null; }

    shark.mouth = Math.max(0, shark.mouth - dt * 3);

    // Fuchshai: der Schwanzschlag schiebt Gefahren im Vorbeiziehen weg
    if (hasPass('peitsche') && speed > 150) {
      for (var pz = 0; pz < hazards.length; pz++) {
        var hz2 = hazards[pz];
        var wx = hz2.x - shark.x, wy = hz2.y - shark.y;
        if (wx * wx + wy * wy < 110 * 110 && hz2.off <= 0) {
          hz2.off = 1.6;
          hz2.x += wx * 0.35; hz2.y += wy * 0.35;
          burst(hz2.x, hz2.y, '#FFFFFF', 6);
        }
      }
    }

    // Helfer treibt Fische zu
    if (helper) {
      helper.x = W * 0.5 + Math.cos(S.t * 0.35 + helper.ph) * (W * 0.33);
      helper.y = H * 0.45 + Math.sin(S.t * 0.5 + helper.ph) * (H * 0.22);
    }

    // Begleitfische
    for (var i2 = 0; i2 < buddies.length; i2++) {
      var bu = buddies[i2];
      var ba = S.t * 1.6 + bu.ph;
      var orb = len * 0.75;
      bu.x = shark.x + Math.cos(ba) * orb;
      bu.y = shark.y + Math.sin(ba) * orb * 0.7;
    }

    // Fische
    var pull = lvl('sog') > 0 ? (70 + 45 * lvl('sog')) : 0;
    if (S.fx.sogstoss > 0) pull = Math.max(pull, 900);
    if (S.fx.tarnen > 0) pull = Math.max(pull, 260);
    // Teppichhai: wer stillliegt, zu dem kommen die Fische von selbst
    if (hasPass('tarnung') && !target && shark.stun <= 0) pull = Math.max(pull, 190);
    var pullPow = (S.fx.sogstoss > 0) ? 220 : (60 + 22 * lvl('sog'));
    for (var i = fishes.length - 1; i >= 0; i--) {
      var f = fishes[i];
      f.x += f.dir * f.sp * dt;
      f.y += Math.sin(S.t * 2 + f.ph) * 14 * dt;

      if (pull > 0) {
        var pdx = shark.x - f.x, pdy = shark.y - f.y;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        if (pd < pull) {
          var force = (1 - pd / pull) * pullPow;
          f.x += (pdx / pd) * force * dt;
          f.y += (pdy / pd) * force * dt;
        }
      }

      if (helper) {
        var kdx = f.x - helper.x, kdy = f.y - helper.y;
        var kd = Math.sqrt(kdx * kdx + kdy * kdy) || 1;
        if (kd < 130) {
          var sdx2 = shark.x - f.x, sdy2 = shark.y - f.y;
          var sd2 = Math.sqrt(sdx2 * sdx2 + sdy2 * sdy2) || 1;
          f.x += (sdx2 / sd2) * 50 * dt;
          f.y += (sdy2 / sd2) * 50 * dt;
        }
      }

      if (f.x < -70 || f.x > W + 70) { fishes.splice(i, 1); continue; }

      var eaten = false;
      var fdx = f.x - shark.x, fdy = f.y - shark.y;
      if (fdx * fdx + fdy * fdy < (bite + f.r) * (bite + f.r) && shark.stun <= 0) {
        eaten = true;
        shark.mouth = 1;
      } else {
        for (var q = 0; q < buddies.length; q++) {
          var qdx = f.x - buddies[q].x, qdy = f.y - buddies[q].y;
          if (qdx * qdx + qdy * qdy < (16 + f.r) * (16 + f.r)) { eaten = true; break; }
        }
      }

      if (eaten) {
        var val = f.val || 1;
        fishes.splice(i, 1);
        burst(f.x, f.y, f.col, 6 + val * 2);
        S.catch[f.kind] = (S.catch[f.kind] || 0) + 1;
        if (val >= 10) {
          sfxWin(); shake = Math.max(shake, 6);
          burst(f.x, f.y, '#FFF3B0', 30);
        } else if (val >= 5) {
          sfxCard();
          burst(f.x, f.y, '#FFF3B0', 14);
        } else {
          sfxEat();
        }
        shark.pop = 1 + Math.min(1, val / 5);
        if (target && target.fish === f) target = null;
        if (gainFish(val)) return;
      }
    }
    while (fishes.length < fishTarget()) spawnFish(true);

    // Gefahren
    var el = lvl('elektro');
    for (var h = 0; h < hazards.length; h++) {
      var z = hazards[h];
      if (z.off > 0) { z.off -= dt; }

      if (z.kind === 'jelly') {
        z.y += z.dirY * z.vy * dt * (z.off > 0 ? 0.2 : 1);
        z.x += Math.sin(S.t + z.ph) * 10 * dt;
        if (z.y < 110) z.dirY = 1;
        if (z.y > H - 90) z.dirY = -1;
      } else if (z.kind === 'net') {
        z.x += z.vx * dt;
        if (z.x < 60 || z.x > W - 60) z.vx *= -1;
      } else if (z.kind === 'hook') {
        z.y += Math.sin(S.t * 1.2 + z.ph) * 16 * dt;
        z.x += Math.sin(S.t * 0.5 + z.ph) * 12 * dt;
        if (z.x < 40) z.x = 40;
        if (z.x > W - 40) z.x = W - 40;
      } else if (z.kind === 'strudel') {
        z.rot += dt * 1.6;
        z.x += z.vx * dt * (z.off > 0 ? 0.2 : 1);
        if (z.x < 70 || z.x > W - 70) z.vx *= -1;
      } else if (z.kind === 'bigshark') {
        z.x += z.dir * z.sp * dt * (z.off > 0 ? 0.3 : 1);
        if (z.dir > 0 && z.x > W + 200) { z.x = -200; z.y = 140 + Math.random() * (H - 300); }
        if (z.dir < 0 && z.x < -200) { z.x = W + 200; z.y = 140 + Math.random() * (H - 300); }
      }

      // Elektrohaut macht Gefahren stufenweise harmlos
      var immune = false;
      if (el >= 1 && z.kind === 'jelly') immune = true;
      if (el >= 3 && (z.kind === 'net' || z.kind === 'hook')) immune = true;
      if (el >= 4 && z.kind === 'strudel') immune = true;
      if (el >= 5) immune = true;

      if (shark.stun <= 0 && z.off <= 0) {
        var hdx = shark.x - z.x, hdy = shark.y - z.y;
        var hd = Math.sqrt(hdx * hdx + hdy * hdy) || 1;
        if (hd < z.r + bite * 0.8) {
          if (immune) {
            z.off = 3.5;
            burst(z.x, z.y, '#C6A0FF', 12);
            sfxShield();
          } else if (shark.shield > 0) {
            shark.shield = 0; shark.shieldT = 0;
            z.off = 2.0;
            burst(shark.x, shark.y, '#8ECBFF', 16);
            sfxShield();
          } else {
            stunFor(z.kind === 'bigshark' ? 1.1 : 1.3);
            target = null;
            shark.x += (hdx / hd) * 30;
            shark.y += (hdy / hd) * 30;
            shark.ang = Math.atan2(hdy, hdx);
            burst(shark.x, shark.y, '#FFFFFF', 10);
            sfxBump();
          }
        }
      }
    }

    // Boss
    if (boss) {
      boss.timer += dt;
      var slow = Math.max(0.35, 1 - boss.timer / 70);

      // Steckt der Hai in einer Ecke und der Boss ist nah? Dann zurueckweichen.
      var eng = (shark.x < 110 || shark.x > W - 110 || shark.y < 150 || shark.y > H - 110);
      var distSB = Math.sqrt((boss.x - shark.x) * (boss.x - shark.x) + (boss.y - shark.y) * (boss.y - shark.y));
      if (eng && distSB < boss.plateR * 1.9) boss.backoff = Math.max(boss.backoff || 0, 0.7);

      if (boss.backoff > 0) {
        boss.backoff -= dt;
        var fx2 = boss.x - shark.x, fy2 = boss.y - shark.y;
        var fd2 = Math.sqrt(fx2 * fx2 + fy2 * fy2) || 1;
        boss.x += (fx2 / fd2) * 150 * dt;
        boss.y += (fy2 / fd2) * 150 * dt;
        boss.cx = boss.x; boss.cy = boss.y;
      } else if (boss.move === 'kreisen') {
        boss.x = boss.cx + Math.cos(boss.timer * 0.55 * slow) * Math.min(W * 0.26, 120);
        boss.y = boss.cy + Math.sin(boss.timer * 0.55 * slow) * Math.min(H * 0.16, 110);
      } else if (boss.move === 'aufab') {
        boss.x += boss.vx * dt * slow * 0.6;
        boss.y = boss.cy + Math.sin(boss.timer * 0.75 * slow) * Math.min(H * 0.13, 95);
        if (boss.x < 130) { boss.x = 130; boss.vx = Math.abs(boss.vx); }
        if (boss.x > W - 130) { boss.x = W - 130; boss.vx = -Math.abs(boss.vx); }
      } else if (boss.move === 'stuermen') {
        boss.chargeT -= dt;
        if (boss.charge > 0) {
          boss.charge -= dt;
          boss.x += boss.vx * dt;
          boss.y += boss.vy * dt;
        } else {
          if (boss.chargeT <= 0) {
            var adx = shark.x - boss.x, ady = shark.y - boss.y;
            var ad = Math.sqrt(adx * adx + ady * ady) || 1;
            boss.vx = (adx / ad) * 210 * slow;
            boss.vy = (ady / ad) * 210 * slow;
            boss.charge = 0.75;
            boss.chargeT = 3.4;
          } else {
            boss.x += Math.sin(boss.timer * 0.8) * 22 * dt;
            boss.y += Math.cos(boss.timer * 0.6) * 18 * dt;
          }
        }
      } else {
        boss.x += boss.vx * dt * slow;
        boss.y += boss.vy * dt * slow;
        if (boss.x < 130) { boss.x = 130; boss.vx = Math.abs(boss.vx); }
        if (boss.x > W - 130) { boss.x = W - 130; boss.vx = -Math.abs(boss.vx); }
        if (boss.y < 160) { boss.y = 160; boss.vy = Math.abs(boss.vy); }
        if (boss.y > H - 140) { boss.y = H - 140; boss.vy = -Math.abs(boss.vy); }
      }
      // Grenzen so, dass auch die aeusserste Platte im Schwimmbereich liegt
      var ext = boss.plateR * (boss.armor === 'kreuz' ? 1.20 : (boss.armor === 'schild' ? 1.12 : 1.0)) + 16;
      var minX = 40 + ext, maxX = W - 40 - ext;
      var minY = 90 + ext, maxY = H - 45 - ext;
      if (minX > maxX) { minX = maxX = W / 2; }
      if (minY > maxY) { minY = maxY = H / 2; }
      if (boss.x < minX) boss.x = minX;
      if (boss.x > maxX) boss.x = maxX;
      if (boss.y < minY) boss.y = minY;
      if (boss.y > maxY) boss.y = maxY;
      boss.rot += dt * 0.45 * slow;

      // Der Schild dreht sich traege zum Hai - schnell genug zum Blocken,
      // langsam genug, dass man ihn umschwimmen kann
      if (boss.armor === 'schild') {
        var wantA = Math.atan2(shark.y - boss.y, shark.x - boss.x);
        var dA = wantA - boss.shieldAng;
        while (dA > Math.PI) dA -= 6.2832;
        while (dA < -Math.PI) dA += 6.2832;
        boss.shieldAng += dA * Math.min(1, dt * 1.6);
      }

      boss.tired = 1 - platesLeft() / boss.plates.length;
      var dmg = 1 + lvl('panzer') + (boss.timer > 32 ? 3 : 0);

      for (var pi = 0; pi < boss.plates.length; pi++) {
        var pl = boss.plates[pi];
        if (pl.flash > 0) pl.flash -= dt;
        if (!pl.alive) continue;
        var ppos = platePos(boss, pi);
        var ppx = ppos.x, ppy = ppos.y;
        var sdx = shark.x - ppx, sdy = shark.y - ppy;
        if (sdx * sdx + sdy * sdy < (32 + bite * 0.8) * (32 + bite * 0.8) && shark.stun <= 0) {
          pl.hp -= dmg;
          pl.flash = 0.12;
          shark.mouth = 1;
          burst(ppx, ppy, '#E8E0C8', 10);
          sfxCrack();
          if (pl.hp <= 0) {
            pl.alive = false;
            burst(ppx, ppy, '#FFF3B0', 18);
            shake = Math.max(shake, 4);
          }
          // sanft abprallen, damit er nicht kleben bleibt
          var sd = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
          shark.x += (sdx / sd) * 26;
          shark.y += (sdy / sd) * 26;
          shark.ang = Math.atan2(sdy, sdx);
          target = null;
        }
      }

      if (platesLeft() === 0) {
        boss.done += dt;
        if (boss.done > 0.05 && boss.done < 0.1) {
          burst(boss.x, boss.y, '#FFF3B0', 40);
          sfxWin();
        }
        if (boss.done > 1.2) finishDive();
      } else {
        // Kontakt mit dem Bosskoerper: abprallen, kurz betaeubt
        var bdx = shark.x - boss.x, bdy = shark.y - boss.y;
        var bd = Math.sqrt(bdx * bdx + bdy * bdy) || 1;
        if (bd < boss.r + bite * 0.5 && shark.stun <= 0) {
          if (shark.shield > 0) {
            shark.shield = 0; shark.shieldT = 0;
            burst(shark.x, shark.y, '#8ECBFF', 14);
            sfxShield();
          } else {
            stunFor(1.0);
            burst(shark.x, shark.y, '#FFFFFF', 10);
            sfxBump();
          }
          // Immer Richtung Bildmitte freischieben, nie in die Ecke
          var toCx = W / 2 - shark.x, toCy = H / 2 - shark.y;
          var tc = Math.sqrt(toCx * toCx + toCy * toCy) || 1;
          shark.x = boss.x + (bdx / bd) * (boss.r + bite * 1.1) + (toCx / tc) * 30;
          shark.y = boss.y + (bdy / bd) * (boss.r + bite * 1.1) + (toCy / tc) * 30;
          shark.ang = Math.atan2(toCy, toCx);
          S.fx.immun = Math.max(S.fx.immun || 0, 1.6);
          boss.backoff = 1.5;
          boss.charge = 0;
          boss.chargeT = Math.max(boss.chargeT, 2.5);
          target = null;
        }
      }
    }
  }

  // Fische zaehlen, Boss ausloesen, Karten anbieten
  function gainFish(n) {
    for (var i = 0; i < n; i++) {
      S.diveFish++;
      if (S.diveFish % 5 === 0) stashDive();
      if (!boss && S.diveFish >= FISH_FOR_BOSS) spawnBoss();
      if (S.diveFish >= cardThreshold(S.cardIdx)) {
        S.cardIdx++;
        openCards();
        return true;
      }
    }
    return false;
  }

  // Tigerhai steckt Betaeubungen halb so lang weg
  function stunFor(v) {
    if (S.fx.immun > 0) return;
    shark.stun = hasPass('zaeh') ? v * 0.5 : v;
  }

  var ring = null;      // ausbreitender Ring beim Ausloesen
  var trail = [];       // Spur beim Rasen

  function useActive() {
    if (S.screen !== 'game' || S.actT > 0) return;
    var a = myAbil().act;
    S.actT = ACT_COOLDOWN;
    ring = { x: shark.x, y: shark.y, t: 0, col: abilCol(myAbil().icon), max: 260 };
    S.fx.aura = 2.5;
    var i;

    if (a === 'riesenbiss') { S.fx.riesenbiss = 2.5; burst(shark.x, shark.y, '#FF6F91', 18); }
    else if (a === 'rakete') { S.fx.rakete = 1.3; burst(shark.x, shark.y, '#FFD24A', 20); }
    else if (a === 'doppelsprint') { S.fx.doppelsprint = 2.2; burst(shark.x, shark.y, '#FFD24A', 14); }
    else if (a === 'schuetteln') { shark.stun = 0; S.fx.immun = 2.5; burst(shark.x, shark.y, '#C6A0FF', 20); }
    else if (a === 'blaseauf') { shark.shield = 1; shark.shieldT = 0; burst(shark.x, shark.y, '#8ECBFF', 18); }
    else if (a === 'sogstoss') { S.fx.sogstoss = 1.8; burst(shark.x, shark.y, '#7CE0C0', 22); }
    else if (a === 'tarnen') { S.fx.tarnen = 3.5; }
    else if (a === 'schwarm') {
      // direkt um den Hai herum, damit man es sieht
      for (i = 0; i < 7; i++) {
        spawnFish(false);
        var nf = fishes[fishes.length - 1];
        var aa = (6.2832 / 7) * i + Math.random() * 0.4;
        var rr4 = 70 + Math.random() * 60;
        nf.x = Math.max(30, Math.min(W - 30, shark.x + Math.cos(aa) * rr4));
        nf.y = Math.max(90, Math.min(H - 40, shark.y + Math.sin(aa) * rr4));
        burst(nf.x, nf.y, nf.col, 8);
      }
    }
    else if (a === 'rufen') { S.fx.rufen = 12; syncBuddies(); }
    else if (a === 'schluckwelle') {
      var got = 0;
      for (i = fishes.length - 1; i >= 0; i--) {
        var f2 = fishes[i];
        var dx2 = f2.x - shark.x, dy2 = f2.y - shark.y;
        if (dx2 * dx2 + dy2 * dy2 < 160 * 160) {
          burst(f2.x, f2.y, f2.col, 6);
          S.catch[f2.kind] = (S.catch[f2.kind] || 0) + 1;
          got += (f2.val || 1);
          fishes.splice(i, 1);
        }
      }
      shark.mouth = 1;
      shake = 4;
      if (got) { sfxEat(); if (gainFish(got)) { sfxCard(); return; } }
    }
    else if (a === 'saege') {
      if (boss) {
        var best = -1, bd2 = 1e9;
        for (i = 0; i < boss.plates.length; i++) {
          if (!boss.plates[i].alive) continue;
          var qpos = platePos(boss, i);
          var qx = qpos.x, qy = qpos.y;
          var q2 = (qx - shark.x) * (qx - shark.x) + (qy - shark.y) * (qy - shark.y);
          if (q2 < bd2) { bd2 = q2; best = i; }
        }
        if (best >= 0) {
          var bpos = platePos(boss, best);
          boss.plates[best].alive = false;
          burst(bpos.x, bpos.y, '#FFF3B0', 22);
          sfxCrack();
          shake = 6;
        }
      } else {
        S.fx.riesenbiss = 2.0;   // ohne Boss wirkt die Saege als kraeftiger Biss
      }
    }
    else if (a === 'peitsche') {
      for (i = 0; i < hazards.length; i++) {
        var z2 = hazards[i];
        var hx2 = z2.x - shark.x, hy2 = z2.y - shark.y;
        var hd2 = Math.sqrt(hx2 * hx2 + hy2 * hy2) || 1;
        if (hd2 < 240) {
          z2.off = 3.5;
